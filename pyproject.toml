[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-vault"
version = "0.0.1"
description = "Evidence-bound external memory runtime for AI agents"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["03_IMPLEMENTATION/packages"]
include = [
  "memory_vault*",
  "cognitive_core",
  "memory_controller",
  "graph*",
  "interfaces*",
  "learning*",
  "lifecycle*",
  "memory*",
  "observability*",
  "providers*",
  "retrieval*",
  "security*",
  "xau_kinetic*",
]
