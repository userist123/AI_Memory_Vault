[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-vault"
version = "0.0.1"
description = "Evidence-bound external memory runtime for AI agents"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.2,<51"]

[tool.setuptools.packages.find]
where = ["03_IMPLEMENTATION/packages"]
include = [
  "memory_vault*",
  "cognitive_core",
  "memory_controller",
  "graph*",
  "interfaces*",
  "learning*",
  "lifecycle*",
  "memory*",
  "observability*",
  "providers*",
  "retrieval*",
  "security*",
  "routing*",
  "agent_bridge*",
  "vault_access*",
  "xau_kinetic*",
]
# Test suites that live next to their package are not runtime code (WP-17).
exclude = ["security.tests", "security.tests.*"]
