version: 1
mode: sparse
routing:
  default_agents: 1
  max_agents: 3
  max_primary_agents: 1
  max_skills_per_agent: 2
memory:
  max_results: 5
  max_graph_hops: 1
  retrieve_after_classification: true
context:
  deduplicate: true
  shared_objective_once: true
  shared_memory_once: true
  exclude_obsidian_navigation: true
  exclude_audit_artifacts: true
  exclude_unused_skills: true
skills:
  registry: 99_SYSTEM/Agent_Capability_Registry.md
  load_policy: on_demand
  full_body_only_after_selection: true
specialists:
  output_format: compact_evidence
  max_output_tokens: 600
synthesis:
  max_input_tokens: 2500
  reload_specialist_skills: false
  recursive_council: false
escalation:
  strategy: staged
  replay_full_context: false
telemetry:
  contract: 99_SYSTEM/Token_Budget_Telemetry.md
