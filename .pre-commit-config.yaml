repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks staged secret scan
        entry: gitleaks
        language: system
        pass_filenames: false
        stages: [pre-commit]
        args:
          - protect
          - --staged
          - --redact
          - --config
          - .gitleaks.toml
          - --exit-code
          - "1"
