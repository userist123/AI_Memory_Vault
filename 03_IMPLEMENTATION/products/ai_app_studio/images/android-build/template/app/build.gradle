// Studio-owned (AI App Studio, DESIGN 3.5). Replaces the Capacitor template's app/build.gradle.
// - applicationId comes from -PaasAppId and must be a studio package (dev.aiappstudio.p<16 hex>), the prefix the WSL
//   device host accepts (aas_devhost.PKG_RE); anything else fails the build.
// - debug builds are signed ONLY with the studio keystore mounted at /keys/aas-debug.keystore (never the owner's Android user dir).
// - no test dependencies, no google-services: fewer artifacts in the pinned offline cache.
apply plugin: 'com.android.application'

def aasAppId = providers.gradleProperty('aasAppId').getOrElse('dev.aiappstudio.p0000000000000000')
if (!(aasAppId ==~ /dev\.aiappstudio\.p[0-9a-f]{16}/)) {
    throw new GradleException("aasAppId is not a studio package id")
}
def aasVersionCodeText = providers.gradleProperty('aasVersionCode').getOrElse('1')
if (!(aasVersionCodeText ==~ /[1-9][0-9]{0,9}/) || aasVersionCodeText.toLong() >= 2100000000L) {
    throw new GradleException("aasVersionCode is not a valid Android versionCode")
}
def aasVersionCode = aasVersionCodeText.toInteger()
def aasVersionName = providers.gradleProperty('aasVersionName').getOrElse('1.0.0')
if (!(aasVersionName ==~ /[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,9}/)) {
    throw new GradleException("aasVersionName is not a SemVer major.minor.patch")
}
def aasKeystore = providers.gradleProperty('aasKeystore').getOrElse('/keys/aas-debug.keystore')

android {
    namespace = "dev.aiappstudio.p0000000000000000"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = rootProject.ext.aasBuildToolsVersion
    defaultConfig {
        applicationId aasAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode aasVersionCode
        versionName aasVersionName
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        aas {
            storeFile file(aasKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.aas
        }
        release {
            minifyEnabled false
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
