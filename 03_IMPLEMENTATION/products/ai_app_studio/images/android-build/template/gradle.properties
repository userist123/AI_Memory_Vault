# Studio-owned (AI App Studio, DESIGN 3.5). The image runs Gradle offline with --dependency-verification strict.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.welcome=never
org.gradle.native=false
android.useAndroidX=true
# never download SDK components (the image is the only source of the SDK)
android.builder.sdkDownload=false
# use the pinned build-tools aapt2 instead of extracting one from the Maven cache into the writable Gradle home
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
