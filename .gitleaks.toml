title = "AI Memory Vault secret scanning"

[extend]
useDefault = true

# Imported agent/reference corpora are non-runtime source material and are
# intentionally outside the production credential trust boundary.
[[allowlists]]
description = "Imported non-runtime agent/reference corpora"
paths = [
  '''(^|/)\.agents/''',
  '''(^|/)50_ARTIFACTS/''',
  '''(^|/)07_EVALUATION/''',
  '''(^|/)06_INBOX/RAW_IMPORTS/''',
  '''(^|/)04_RAW_SKILLS_PART_[123]\.txt$''',
  '''(^|/)NOTEBOOKLM_PART3_[12]_RAW_SKILLS\.txt$''',
]

# Generated/test-only material is not part of the production runtime trust boundary.
# Runtime source remains fully scanned; these locations are covered separately
# by the dedicated Secret Scan workflow and repository tests.
[[allowlists]]
description = "Non-runtime test and experiment corpus"
paths = [
  '''(^|/)20_TESTS/''',
  '''(^|/)40_EXPERIMENTS/''',
  '''(^|/)02_PRODUCT/.*/tests/''',
  '''(^|/)tests/''',
  '''(^|/)projects/.*/tests/''',
]

# Python bytecode is generated during the test run and is not source material.
[[allowlists]]
description = "Generated Python bytecode"
paths = [
  '''(^|/)__pycache__/''',
]

# Deterministic synthetic fixtures used by sanitizer/ablation tests; they are not credentials.
[[allowlists]]
description = "Intentional synthetic API-key fixtures"
regexes = [
  '''sk-123456789''',
  '''test_secret_for_ablation_harness_32chars''',
]

# A format label, not a credential: `APPROVAL_TOKEN_VERSION = "b2m-owner-approval-v2"` in
# book_to_memory_lifecycle.py names the owner-approval token format (generic-api-key matched the
# variable name containing "TOKEN"). The signing secret never appears in source.
[[allowlists]]
description = "Book-to-Memory approval token format label"
regexes = [
  '''b2m-owner-approval-v2''',
]

# Placeholder credentials in imported third-party CI workflows.
#
# Narrow on purpose: this covers .github/workflows files inside
# 02_PRODUCT/projects/imported/ and nothing else. Those directories hold whole
# third-party repositories with their own CI, whose build steps set literal env
# values so a build can run without secrets.
#
# The three findings that prompted this, all from commit b71d849f3
# (2026-09-06), were the same line in three copies of one imported project:
#
#     JWT_SECRET: 'ci-placeholder-must-be-32-chars-long-ok'
#
# sitting beside NEXT_PUBLIC_APP_URL: 'https://example.com'. The value states
# what it is. The files are already gone from the working tree — current-tree
# gitleaks passes — so only git history retains them, and the alternative to an
# allowlist was rewriting 1,278 commits on a shared branch.
#
# This does NOT allowlist the imported projects generally, only their workflow
# files. A real credential committed anywhere else under 02_PRODUCT, including
# elsewhere in those same projects, still fails the scan.
[[allowlists]]
description = "Placeholder credentials in imported third-party CI workflows"
paths = [
  '''(^|/)02_PRODUCT/projects/imported/.*/\.github/workflows/.*\.ya?ml$''',
]

# Python type annotations of cryptography key classes, flagged by generic-api-key as
# "private_key: Ed25519PrivateKey" in agent_bridge/crypto.py history (commit 2c9c1018ef,
# PR #211). The "value" is a class name, not key material. CI scans `--all` refs, so one
# historical false positive on any branch fails every PR's history scan.
[[allowlists]]
description = "Cryptography key type annotations (class names, not keys)"
regexTarget = "match"
regexes = [
  '''(?:private|public)_key:\s*(?:Ed25519|X25519)(?:Private|Public)Key\b''',
]

# Two historical false positives in LogAnalyzer documents (generic-api-key). CI scans every ref in
# history, so one finding on a branch fails the history scan of every PR; rewriting history is the
# owner's decision, so the two values are allowlisted by exact secret match.
#
# 1. "dG9rZW4tMjAxNw" is the public, documented query parameter of the European Commission's
#    consolidated financial sanctions list download URL (base64 of a fixed word published in the
#    EU's own documentation), quoted in a library-provenance table (commit 21241d38c, since removed).
# 2. "RunMRU/ClickFix" is a rule name in a prose table row ("LSASS access, RunMRU/ClickFix parser"),
#    matched because the word "access" is a generic-api-key keyword (commit 667f76d77).
[[allowlists]]
description = "Public EU sanctions-list URL parameter and a rule name in LogAnalyzer prose (not credentials)"
regexes = [
  '''^dG9rZW4tMjAxNw$''',
  '''^RunMRU/ClickFix$''',
]
