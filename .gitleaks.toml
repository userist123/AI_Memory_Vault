title = "AI Memory Vault secret scanning"

[extend]
useDefault = true

# Imported agent/reference corpora are stored as non-runtime source material.
# They are intentionally outside the production credential trust boundary.
[[allowlists]]
description = "Imported non-runtime agent and reference corpora"
paths = [
  '''^\.agents/''',
  '''^50_ARTIFACTS/exports/notebooklm/''',
]

# Deterministic non-secret values used only by tests/harnesses.
[[allowlists]]
description = "Intentional deterministic test fixtures"
regexes = [
  '''test_secret_for_ablation_harness_32chars''',
  '''test_secret_for_recall_cli_32chars_min''',
]
