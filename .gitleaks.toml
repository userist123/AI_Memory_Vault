title = "AI Memory Vault secret scanning"

[extend]
useDefault = true

# Imported agent/reference corpora are non-runtime source material and are
# intentionally outside the production credential trust boundary.
[[allowlists]]
description = "Imported non-runtime agent/reference corpora"
paths = [
  '''(^|/)\.agents/''',
  '''(^|/)50_ARTIFACTS/''',
  '''(^|/)07_EVALUATION/''',
]

# Generated/test-only material is not part of the production runtime trust boundary.
# Runtime source remains fully scanned; these locations are covered separately
# by the dedicated Secret Scan workflow and repository tests.
[[allowlists]]
description = "Non-runtime test and experiment corpus"
paths = [
  '''(^|/)20_TESTS/''',
  '''(^|/)40_EXPERIMENTS/''',
  '''(^|/)02_PRODUCT/.*/tests/''',
]

# Python bytecode is generated during the test run and is not source material.
[[allowlists]]
description = "Generated Python bytecode"
paths = [
  '''(^|/)__pycache__/''',
]

# Deterministic synthetic fixtures used by sanitizer/ablation tests; they are not credentials.
[[allowlists]]
description = "Intentional synthetic API-key fixtures"
regexes = [
  '''sk-123456789''',
  '''test_secret_for_ablation_harness_32chars''',
]
