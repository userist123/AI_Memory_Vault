[pytest]
norecursedirs = AI_Memory_Vault_OBSIDIAN .git .vs
# Both roots, because the repository has two import conventions for the same
# code and each was being made to work by a different mechanism.
#
# 165 test imports read `from polymarket.x` / `from memory_controller.x`, which
# needs 03_IMPLEMENTATION/packages. Six polymarket modules read
# `from packages.polymarket.x`, which needs 03_IMPLEMENTATION and was being
# supplied per-workflow by `PYTHONPATH: 03_IMPLEMENTATION` in the phase 3-6 CI
# files. Locally, nothing supplied it: a bare `pytest 20_TESTS/` failed
# collection on every one of those six with ModuleNotFoundError, so the phases
# already merged were passing in CI and unrunnable by hand.
#
# Listing both makes a bare pytest run the whole suite. It does not unify the
# conventions — that is a separate change touching six files and their history.
pythonpath = 03_IMPLEMENTATION/packages 03_IMPLEMENTATION
testpaths = 20_TESTS
