    required_facts: ["fact", "decision", "procedure", "lesson", "task"]
    required_sections: ["Task 3 — Multi-Graph Node Type Controlled Vocabulary"]
    critical_invariants: ["CONTROLLED_NODE_TYPES = {fact, decision, procedure, lesson, task, intent, tool, failure, correction, outcome}"]
    critical_negations: ["unmapped categories fallback to fact"]
    critical_entities: ["multi_graph.py", "CONTROLLED_NODE_TYPES"]

  - id: "Q15_SIMPLE_PRIME_DIRECTIVE"
    class: "SIMPLE_FACT"
    query: "What is the Prime Directive of the AI Memory System operating contract?"
    required_facts: ["better memory", "better routing", "context is expensive"]
    required_sections: ["## Prime Directive"]
    critical_invariants: ["Better memory beats more memory. Better routing beats more agents. Capability is cheap; loaded context is expensive."]
    critical_negations: []
    critical_entities: ["Prime Directive", "AGENTS.md"]
