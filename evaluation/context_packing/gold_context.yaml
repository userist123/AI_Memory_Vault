    critical_negations: ["cannot be modified after initial creation", "immutable"]
    critical_entities: ["provenance.source_type", "OutcomeRecord"]

  - id: "Q14_MULTIHOP_GRAPH_NODE_SCHEMA"
    class: "MULTI_HOP"
