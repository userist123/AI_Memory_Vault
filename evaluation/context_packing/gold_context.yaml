    required_facts: ["3", "1"]
    required_sections: ["## Runtime Context Contract"]
    critical_invariants: ["MAX_COUNCIL_AGENTS = 3", "MAX_PRIMARY_AGENTS = 1"]
    critical_negations: []
    critical_entities: ["MAX_COUNCIL_AGENTS", "MAX_PRIMARY_AGENTS"]

  - id: "Q04_COUNCIL_TOKEN_BUDGETS"
