# CodeQL for the LogAnalyzer C# code (.NET / WPF). Kept apart from codeql.yml because C# needs a Windows build.
# It runs on every pull request to main, on push to main, weekly, and on demand. It is deliberately NOT path-filtered:
# the "Code scanning results / CodeQL" check compares a pull request with the configurations present on main, and a
# configuration missing from the PR (here /language:csharp) makes that check "neutral" instead of pass/fail. The job
# (~7 min) finishes well inside the time the longest Python jobs already take, so it does not lengthen pull requests.
# Results land in the same code-scanning view under the category /language:csharp.
name: "CodeQL C# (LogAnalyzer)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    defaults:
      run:
        working-directory: 02_PRODUCT/projects/workspaces/loganalyzer-dfir

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/global.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: csharp
        build-mode: manual

    # The whole solution (WPF app included) is compiled under the CodeQL tracer; tests are built, not run.
    - name: Build (traced)
      run: |
        dotnet restore LogAnalyzer.slnx
        dotnet build LogAnalyzer.slnx --no-restore --configuration Release --no-incremental -p:UseSharedCompilation=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:csharp"
