# CodeQL for the LogAnalyzer C# code (.NET / WPF). Kept apart from codeql.yml on purpose: C# needs a Windows build, and
# running a Windows build for every pull request of this repository (Python, YAML, docs) would slow all of them down and
# put an unrelated check on them. It runs when the LogAnalyzer project changes, weekly, and on demand.
# Results land in the same code-scanning view under the category /language:csharp.
name: "CodeQL C# (LogAnalyzer)"

on:
  push:
    branches: [ "main" ]
    paths:
      - '02_PRODUCT/projects/workspaces/loganalyzer-dfir/**'
      - '.github/workflows/codeql-csharp.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '02_PRODUCT/projects/workspaces/loganalyzer-dfir/**'
      - '.github/workflows/codeql-csharp.yml'
  schedule:
    - cron: '30 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    defaults:
      run:
        working-directory: 02_PRODUCT/projects/workspaces/loganalyzer-dfir

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: csharp
        build-mode: manual

    # The whole solution (WPF app included) is compiled under the CodeQL tracer; tests are built, not run.
    - name: Build (traced)
      run: |
        dotnet restore LogAnalyzer.slnx
        dotnet build LogAnalyzer.slnx --no-restore --configuration Release --no-incremental -p:UseSharedCompilation=false

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: "/language:csharp"
