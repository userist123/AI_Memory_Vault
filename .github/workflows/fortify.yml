name: Fortify AST Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 2 * * 1'
  workflow_dispatch:

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check Out Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Neutralize stale gitlink before checkout cleanup
        shell: bash
        run: git update-index --force-remove -- '04_CONFIG/obsidian/AI_Memory_Vault_OBSIDIAN' 2>/dev/null || true

      - name: Check Fortify configuration
        id: config
        shell: bash
        env:
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PAT: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "scan_status=SKIPPED_PULL_REQUEST" >> "$GITHUB_OUTPUT"
            echo "::notice title=Fortify scan skipped on PR::Credentialed Fortify scan does not run on pull_request (status: SKIPPED_PULL_REQUEST)."
          elif [[ -n "$FOD_TENANT" && -n "$FOD_USER" && -n "$FOD_PAT" ]] || \
               [[ -n "$FOD_TENANT" && -n "$FOD_CLIENT_ID" && -n "$FOD_CLIENT_SECRET" ]] || \
               [[ -n "$SSC_URL" && -n "$SSC_TOKEN" && -n "$SC_SAST_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "scan_status=CONFIGURED" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "scan_status=SKIPPED_UNCONFIGURED" >> "$GITHUB_OUTPUT"
            echo "::notice title=Fortify scan not executed::Fortify external credentials are not configured; scan will be skipped without masking configuration gap (status: SKIPPED_UNCONFIGURED)."
          fi

      - name: Run Fortify Scan
        id: fortify_scan
        if: steps.config.outputs.configured == 'true'
        uses: fortify/github-action@0540f6aefd95d12a5fbed40f406d825fad64330e # v3.1.1
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: https://ams.fortify.com
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
          SC_SAST_SENSOR_VERSION: 24.4.0

      - name: Report Fortify scan execution status
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.config.outputs.configured }}" == "true" ]]; then
            scan_outcome="${{ steps.fortify_scan.outcome }}"
            if [[ "$scan_outcome" == "success" ]]; then
              echo "Fortify execution status: EXECUTED_PASSED"
            else
              echo "Fortify execution status: EXECUTED_FAILED"
            fi
          else
            status="${{ steps.config.outputs.scan_status || 'NOT_CONFIGURED_OPTIONAL' }}"
            echo "Fortify execution status: $status"
          fi
