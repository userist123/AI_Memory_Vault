# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Fortify AST Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 2 * * 1'
  workflow_dispatch:

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check Out Source Code
        uses: actions/checkout@v4

      - name: Check Fortify configuration
        id: config
        shell: bash
        env:
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PAT: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}
        run: |
          configured=false
          if [[ -n "$FOD_TENANT" && -n "$FOD_USER" && -n "$FOD_PAT" ]]; then
            configured=true
          elif [[ -n "$FOD_TENANT" && -n "$FOD_CLIENT_ID" && -n "$FOD_CLIENT_SECRET" ]]; then
            configured=true
          elif [[ -n "$SSC_URL" && -n "$SSC_TOKEN" && -n "$SC_SAST_TOKEN" ]]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" != "true" ]]; then
            echo "Fortify external service credentials are not configured; scan will be skipped without masking this configuration gap."
          fi

      - name: Run Fortify Scan
        if: steps.config.outputs.configured == 'true'
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: https://ams.fortify.com
          FOD_TENANT: ${{ secrets.FOD_TENANT }}
          FOD_USER: ${{ secrets.FOD_USER }}
          FOD_PASSWORD: ${{ secrets.FOD_PAT }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
          SC_SAST_SENSOR_VERSION: 24.4.0

      - name: Fortify configuration note
        if: steps.config.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::notice title=Fortify scan not executed::Configure FOD_TENANT + FOD_USER + FOD_PAT, or FOD_TENANT + FOD_CLIENT_ID + FOD_CLIENT_SECRET, or SSC credentials to enable the external Fortify scan."
