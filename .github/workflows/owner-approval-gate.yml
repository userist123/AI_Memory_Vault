name: owner-approval-gate
on:
  pull_request_review:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  owner-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository owner approval for the current commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'userist123';
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );
            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user?.login) {
                latestByUser.set(review.user.login.toLowerCase(), review);
              }
            }
            const ownerReview = latestByUser.get(owner.toLowerCase());
            if (!ownerReview || ownerReview.state !== 'APPROVED') {
              core.setFailed('Blocked: repository owner @userist123 must explicitly approve this PR.');
            } else if (ownerReview.commit_id !== pr.data.head.sha) {
              core.setFailed('Blocked: owner approval is stale; it does not approve the current commit.');
            } else {
              core.info('Owner approval verified for the current PR head commit.');
            }
