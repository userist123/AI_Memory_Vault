name: owner-approval-gate
on:
  pull_request_review:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  owner-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository owner approval
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'userist123';
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {owner: context.repo.owner, repo: context.repo.repo,
               pull_number: context.issue.number, per_page: 100}
            );
            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user?.login) latestByUser.set(review.user.login.toLowerCase(), review);
            }
            const ownerReview = latestByUser.get(owner.toLowerCase());
            if (!ownerReview || ownerReview.state !== 'APPROVED') {
              core.setFailed('Blocked: repository owner @userist123 must explicitly approve this PR.');
            }
