name: Scheduled Memory Consolidation

on:
  schedule:
    timeout-minutes: 20
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consolidate:
    name: Run Sleep-Phase Consolidation Report (advisory, read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-memory-v6.txt

      - name: Run consolidation
        env:
          PYTHONPATH: 03_IMPLEMENTATION/packages
        run: |
          mkdir -p 08_OBSERVABILITY/reports
          python -m cognitive_core.memory_v6_cli consolidate --output 08_OBSERVABILITY/reports/sleep_consolidation_report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sleep-consolidation-report
          path: 08_OBSERVABILITY/reports/sleep_consolidation_report.json
          retention-days: 30
