name: Scheduled Memory Consolidation

on:
  schedule:

    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consolidate:
    name: Run Sleep-Phase Consolidation Report (advisory, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-memory-v6.txt
          python -m pip install pytest==9.1.1 pyyaml==6.0.3 numpy==2.2.6

      - name: Run consolidation
        env:
          PYTHONPATH: 03_IMPLEMENTATION/packages
        run: |
          mkdir -p 08_OBSERVABILITY/reports
          python -m cognitive_core.memory_v6_cli consolidate --output 08_OBSERVABILITY/reports/sleep_consolidation_report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sleep-consolidation-report
          path: 08_OBSERVABILITY/reports/sleep_consolidation_report.json
          retention-days: 30
