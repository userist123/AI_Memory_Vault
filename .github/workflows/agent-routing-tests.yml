name: Agent Routing Tests

on:
  push:
    paths:
      - '03_IMPLEMENTATION/packages/routing/**'
      - '04_CONFIG/agent_router.json'
      - '20_TESTS/test_agent_router.py'
      - '20_TESTS/test_agent_dispatcher.py'
      - '20_TESTS/test_secure_agent_bridge.py'
      - '20_TESTS/test_secure_bridge_handler.py'
      - '20_TESTS/test_claude_contract.py'
      - '03_IMPLEMENTATION/packages/agent_bridge/**'
      - '.github/workflows/agent-routing-tests.yml'
  pull_request:
    paths:
      - '03_IMPLEMENTATION/packages/routing/**'
      - '04_CONFIG/agent_router.json'
      - '20_TESTS/test_agent_router.py'
      - '20_TESTS/test_agent_dispatcher.py'
      - '20_TESTS/test_secure_agent_bridge.py'
      - '20_TESTS/test_secure_bridge_handler.py'
      - '03_IMPLEMENTATION/packages/agent_bridge/**'
      - '.github/workflows/agent-routing-tests.yml'

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3 cryptography==46.0.3
      - name: Compile routing package
        env:
          PYTHONPATH: .:03_IMPLEMENTATION/packages
        run: python -m compileall -q 03_IMPLEMENTATION/packages/routing 03_IMPLEMENTATION/packages/agent_bridge
      - name: Run routing and bridge tests
        env:
          PYTHONPATH: .:03_IMPLEMENTATION/packages
        run: pytest -q 20_TESTS/test_agent_router.py 20_TESTS/test_agent_dispatcher.py 20_TESTS/test_secure_agent_bridge.py 20_TESTS/test_secure_bridge_handler.py 20_TESTS/test_claude_contract.py
      - name: Smoke test route CLI
        env:
          PYTHONPATH: .:03_IMPLEMENTATION/packages
        run: |
          python -m routing.route_cli probe
          python -m routing.route_cli route --goal "inspect the repository architecture and propose a safe implementation plan"
