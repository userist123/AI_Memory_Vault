name: JARVIS Command Center

on:
  push:
    branches: [main]
    paths:
      - 'projects/jarvis_web/**'
      - 'memory_controller/**'
      - '.agents/skills/jarvis-command-center/**'
      - '.github/workflows/jarvis-command-center.yml'
  pull_request:
    paths:
      - 'projects/jarvis_web/**'
      - 'memory_controller/**'
      - '.agents/skills/jarvis-command-center/**'
      - '.github/workflows/jarvis-command-center.yml'

jobs:
  jarvis-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax
        run: python -m compileall -q memory_controller projects/jarvis_web/test/api_smoke_test.py
      - name: Web smoke test
        run: node projects/jarvis_web/test/smoke_test.cjs
      - name: API smoke test
        run: python projects/jarvis_web/test/api_smoke_test.py
