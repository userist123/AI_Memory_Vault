# documentation.

name: APIsec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '44 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    permissions:
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Check APIsec configuration
        id: config
        shell: bash
        env:
          APISEC_USERNAME: ${{ secrets.apisec_username }}
          APISEC_PASSWORD: ${{ secrets.apisec_password }}
        run: |
          configured=false
          if [[ -n "$APISEC_USERNAME" && -n "$APISEC_PASSWORD" ]]; then
            configured=true
          else
            echo "APIsec credentials are not configured; scan will be skipped without masking this configuration gap."
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: APIsec scan
        if: steps.config.outputs.configured == 'true'
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: steps.config.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./apisec-results.sarif

      - name: APIsec configuration note
        if: steps.config.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::notice title=APIsec scan not executed::Configure apisec_username and apisec_password repository secrets to enable the external APIsec scan."
