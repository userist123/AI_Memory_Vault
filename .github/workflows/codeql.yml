# CodeQL is intentionally scoped to languages actually present in this repository: GitHub Actions workflows,
# Python, and JavaScript/TypeScript (jarvis_web; imported/untrusted material is excluded by
# .github/codeql/javascript-config.yml). C# (LogAnalyzer) needs a Windows build and has its own workflow:
# codeql-csharp.yml.
# The "Code scanning results / CodeQL" check on a pull request compares the PR's analyses with the
# configurations present on main. Every language analyzed on main must therefore also be analyzed on every
# pull request, otherwise the check ends "neutral" (configurations not found) instead of pass/fail.
name: "CodeQL Advanced"

on:
  push:

    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 23 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        - language: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/javascript-config.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ${{ matrix.config-file }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{matrix.language}}"
