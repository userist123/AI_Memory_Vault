name: Polymarket Phase 19 Historical Calibration Holdout Tests

on:
  pull_request:
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/historical_calibration_holdout.py'
      - '20_TESTS/polymarket/test_historical_calibration_holdout.py'
      - '.github/workflows/polymarket-phase19-historical-calibration-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase19-historical-calibration-holdout:
    name: phase19-historical-calibration-holdout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Phase 19 tests
        run: python -m pytest -q 20_TESTS/polymarket/test_historical_calibration_holdout.py
