name: Import external skills

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated import branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="skills-import/${RUN_ID}"
          git checkout -b "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Clone pinned external sources
        run: python 30_SCRIPTS/verification/import_external_skills.py clone

      - name: Filter and stage imported material
        run: python 30_SCRIPTS/verification/import_external_skills.py filter

      - name: Scan imported material before commit
        env:
          PYTHONPATH: .
        run: python 30_SCRIPTS/verification/import_external_skills.py scan

      - name: Build registry with SHA-256 evidence
        run: python 30_SCRIPTS/verification/import_external_skills.py registry

      - name: Commit imported skills
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_KNOWLEDGE/EXTERNAL_SKILLS
          git diff --cached --quiet && exit 0
          git commit -m 'feat(skills): import pinned external skill libraries'

      - name: Push isolated import branch and open PR
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          # Explicitly approved side effect: workflow_dispatch -> isolated skills-import/* branch only.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
          gh pr create --base main --head "${BRANCH}" --title "feat(skills): import pinned external skill libraries" --body-file 01_KNOWLEDGE/EXTERNAL_SKILLS/IMPORT_PR_DESCRIPTION.md
