name: Regenerate skill catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-skill-catalog.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate canonical skill catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import yaml

          root = Path('.agents/skills')
          catalog_path = Path('01_KNOWLEDGE/Master_Skills_Catalog_251.md')

          dirs = sorted(p for p in root.iterdir() if p.is_dir())
          names = [p.name for p in dirs]

          if len(names) != len(set(names)):
              raise SystemExit('Duplicate skill directory names detected')

          entries = []
          missing = []
          invalid = []
          for directory in dirs:
              skill_path = directory / 'SKILL.md'
              if not skill_path.is_file():
                  missing.append(directory.name)
                  continue

              text = skill_path.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  invalid.append(directory.name)
                  continue
              end = text.find('\n---', 3)
              if end < 0:
                  invalid.append(directory.name)
                  continue

              frontmatter_text = text[4:end+1]
              try:
                  data = yaml.safe_load(frontmatter_text) or {}
              except Exception as exc:
                  raise SystemExit(f'Invalid YAML frontmatter in {skill_path}: {exc}')

              description = data.get('description', '')
              tags = data.get('tags', [])
              if tags is None:
                  tags = []
              if isinstance(tags, str):
                  tags = [tags]
              elif not isinstance(tags, list):
                  tags = [str(tags)]

              description = str(description).replace('\n', ' ').strip()
              tags = [str(tag).strip() for tag in tags if str(tag).strip()]
              entries.append((directory.name, description, tags))

          if missing:
              raise SystemExit('Missing SKILL.md: ' + ', '.join(missing))
          if invalid:
              raise SystemExit('Invalid/missing frontmatter: ' + ', '.join(invalid))

          directory_count = len(dirs)
          entry_count = len(entries)
          if directory_count != entry_count:
              raise SystemExit(f'ACCEPTANCE FAILED: directories={directory_count}, entries={entry_count}')

          generated = []
          generated.append('---')
          generated.append('id: "cat-skills-251-master"')
          generated.append('type: knowledge')
          generated.append('lifecycle: ACTIVE')
          generated.append('category: skills-catalog')
          generated.append('tags: [skills, catalog, local-corpus, generated-from-directories]')
          generated.append('provenance:')
          generated.append('  source_type: repository-scan')
          generated.append('  source_ref: "userist123/AI_Memory_Vault_CODEX_READY/.agents/skills/"')
          generated.append('  source_commit: "' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '"')
          generated.append('confidence: very_high')
          generated.append('verification: verified')
          generated.append('relations:')
          generated.append('  - "01_KNOWLEDGE/Agents_Skill_Matrix.md"')
          generated.append('  - "00_CORE/GRAPH/14 Subagents Council Map.md"')
          generated.append('---')
          generated.append('')
          generated.append('# 📦 Catalog Canonic: Skills reale din `.agents/skills/`')
          generated.append('')
          generated.append('Generat din numele directoarelor fizice `.agents/skills/`.')
          generated.append('Fiecare intrare corespunde exact unui director și citește exclusiv câmpurile `description` și `tags` din frontmatter-ul YAML al `SKILL.md`.')
          generated.append('')
          generated.append(f'**Directoare detectate:** {directory_count}  |  **Intrări catalog:** {entry_count}  |  **Diferență:** {directory_count-entry_count}')
          generated.append('')
          generated.append('| # | Skill | Path | Description | Tags |')
          generated.append('|---:|---|---|---|---|')

          for index, (name, description, tags) in enumerate(entries, 1):
              safe_description = description.replace('|', '\\|')
              safe_tags = ', '.join(tags).replace('|', '\\|')
              generated.append(f'| {index:03d} | `{name}` | `.agents/skills/{name}` | {safe_description} | {safe_tags} |')

          catalog_path.write_text('\n'.join(generated) + '\n', encoding='utf-8')

          # Machine-check the generated catalog against the physical directory names.
          catalog_text = catalog_path.read_text(encoding='utf-8')
          catalog_names = re.findall(r'^\|\s*\d+\s*\|\s*`([^`]+)`\s*\|\s*`\.agents/skills/[^`]+`\s*\|', catalog_text, flags=re.M)
          if len(catalog_names) != directory_count:
              raise SystemExit(f'ACCEPTANCE FAILED after render: directories={directory_count}, catalog_rows={len(catalog_names)}')
          if catalog_names != names:
              raise SystemExit('ACCEPTANCE FAILED after render: catalog names do not match sorted physical directories 1:1')

          print(f'REAL_DIRECTORIES={directory_count}')
          print(f'NEW_CATALOG_ENTRIES={entry_count}')
          print(f'DIFFERENCE={directory_count-entry_count}')
          PY

      - name: Commit regenerated catalog and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_KNOWLEDGE/Master_Skills_Catalog_251.md
          git rm .github/workflows/regenerate-skill-catalog.yml
          git commit -m 'Regenerate skill catalog from physical skill directories'
          git push origin HEAD:main
