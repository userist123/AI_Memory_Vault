name: Polymarket Phase 4 Tests

on:
  push:

    branches:
      - 'r050-pm-phase4-prediction-council'
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/**'
      - '20_TESTS/polymarket/**'
      - '07_EVALUATION/polymarket/**'
      - '.github/workflows/polymarket-phase4-tests.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: 03_IMPLEMENTATION

jobs:
  phase4:
    name: Phase 4 prediction council
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test runner
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run Phase 1-4 Polymarket tests
        run: |
          python -m pytest -q \
            20_TESTS/polymarket/test_market_snapshot.py \
            20_TESTS/polymarket/test_historical_replay.py \
            20_TESTS/polymarket/test_prediction_ledger.py \
            20_TESTS/polymarket/test_prediction_council.py
