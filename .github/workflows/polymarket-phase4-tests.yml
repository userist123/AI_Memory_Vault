name: Polymarket Phase 4 Tests

on:
  push:
    branches:
      - 'r050-pm-phase4-prediction-council'
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/**'
      - '20_TESTS/polymarket/**'
      - '07_EVALUATION/polymarket/**'
      - '.github/workflows/polymarket-phase4-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: 03_IMPLEMENTATION

jobs:
  phase4:
    name: Phase 4 prediction council
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Phase 1-4 Polymarket tests
        run: |
          python -m pytest -q \
            20_TESTS/polymarket/test_market_snapshot.py \
            20_TESTS/polymarket/test_historical_replay.py \
            20_TESTS/polymarket/test_prediction_ledger.py \
            20_TESTS/polymarket/test_prediction_council.py
