name: Planning Influence MVE

on:
  push:
    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  pull_request:
    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-memory-v6.txt
          pip install pytest numpy

      - name: Run deterministic isolation tests
        run: python -m pytest -v 20_TESTS/test_planning_influence_isolation.py

      - name: Run complete V3 reproducibility suite
        run: python 07_EVALUATION/luna/run_all_v3.py
