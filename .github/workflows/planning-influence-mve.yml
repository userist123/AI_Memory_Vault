name: Planning Influence MVE

on:
  push:
    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  pull_request:
    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mve_v3:
    name: Planning Influence V3 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run isolation and anti-oracle tests
        run: python -m pytest -q 20_TESTS/test_planning_influence_isolation.py

      - name: Run Planning Influence V3 byte-for-byte reproducibility suite
        run: python 07_EVALUATION/luna/run_all_v3.py
