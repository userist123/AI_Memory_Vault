name: Planning Influence MVE

on:
  push:

    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  pull_request:
    paths:
      - '07_EVALUATION/luna/**'
      - '20_TESTS/test_planning_influence_isolation.py'
      - '.github/workflows/planning-influence-mve.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-memory-v6.txt
          pip install pytest==9.1.1 numpy==2.2.6

      - name: Run deterministic isolation tests
        run: python -m pytest -v 20_TESTS/test_planning_influence_isolation.py

      - name: Run complete V3 reproducibility suite
        run: python 07_EVALUATION/luna/run_all_v3.py
