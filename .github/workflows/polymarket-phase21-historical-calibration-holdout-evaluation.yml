name: Polymarket Phase 21 Historical Calibration Holdout Evaluation

on:
  pull_request:
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/historical_calibration_holdout_evaluation.py'
      - '03_IMPLEMENTATION/packages/polymarket/historical_calibration_fit.py'
      - '03_IMPLEMENTATION/packages/polymarket/historical_calibration_holdout.py'
      - '20_TESTS/polymarket/test_historical_calibration_holdout_evaluation.py'
      - '.github/workflows/polymarket-phase21-historical-calibration-holdout-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase21-historical-calibration-holdout-evaluation:
    name: phase21-historical-calibration-holdout-evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 21 tests
        run: python -m pytest -q 20_TESTS/polymarket/test_historical_calibration_holdout_evaluation.py
