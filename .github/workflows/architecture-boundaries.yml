name: Architecture Boundaries

on:
  push:
    branches:
      - main
    paths:
      - '03_IMPLEMENTATION/**'
      - 'cognitive_core/**'
      - 'security/**'
      - 'scripts/**'
      - '04_CONFIG/architecture_layers.json'
      - '30_SCRIPTS/verification/architecture_boundaries.py'
      - '30_SCRIPTS/verification/package_inventory.py'
      - '20_TESTS/test_architecture_boundaries.py'
      - '.github/workflows/architecture-boundaries.yml'
  pull_request:
    paths:
      - '03_IMPLEMENTATION/**'
      - 'cognitive_core/**'
      - 'security/**'
      - 'scripts/**'
      - '04_CONFIG/architecture_layers.json'
      - '30_SCRIPTS/verification/architecture_boundaries.py'
      - '30_SCRIPTS/verification/package_inventory.py'
      - '20_TESTS/test_architecture_boundaries.py'
      - '.github/workflows/architecture-boundaries.yml'

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Check architecture layer boundaries (ratchet)
        run: python 30_SCRIPTS/verification/architecture_boundaries.py
      - name: Run architecture boundary tests
        run: python -m pytest 20_TESTS/test_architecture_boundaries.py -q
