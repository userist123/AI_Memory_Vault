name: Polymarket Phase 3 Tests

on:
  push:
    branches:
      - 'r049-pm-phase3-prediction-ledger'
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/**'
      - '20_TESTS/polymarket/**'
      - '07_EVALUATION/polymarket/**'
      - '.github/workflows/polymarket-phase3-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: 03_IMPLEMENTATION/packages

jobs:
  phase3:
    name: Phase 3 prediction ledger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Phase 1-3 Polymarket tests
        run: |
          python -m pytest -q \
            20_TESTS/polymarket/test_market_snapshot.py \
            20_TESTS/polymarket/test_historical_replay.py \
            20_TESTS/polymarket/test_prediction_ledger.py
