name: LogAnalyzer DFIR Build & Package

# Recovered from LogAnalyzer.UI 137a626 ("MVP export foundation") and adapted to the
# vault workspace: one application (mode chosen at startup), DFIR projects, pinned actions.

on:
  push:
    branches:
      - main
    paths:
      - '02_PRODUCT/projects/workspaces/loganalyzer-dfir/**'
      - '.github/workflows/loganalyzer-dfir-build.yml'
    # A release tag runs the release gate in ENFORCE mode (path filters do not apply to tags).
    tags:
      - 'loganalyzer-v*'
  pull_request:
    paths:
      - '02_PRODUCT/projects/workspaces/loganalyzer-dfir/**'
      - '.github/workflows/loganalyzer-dfir-build.yml'
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: 'Run the release gate in ENFORCE mode (fails unless every R22 item is PASS or WAIVED). Currently impossible: see docs/dfir/RELEASE_GATE.md'
        type: boolean
        default: false
      gate_version:
        description: 'Version the release gate evaluates (selects release-gate/waivers/<version>.json). Empty: DfirInfo.ApplicationVersion'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 02_PRODUCT/projects/workspaces/loganalyzer-dfir

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/global.json

      # Security audit #9: every project restores from its committed packages.lock.json (Directory.Build.props).
      - name: Every project has a committed lock file
        shell: pwsh
        run: |
          $projects = Select-String -Path LogAnalyzer.slnx -Pattern 'Path="([^"]+)\.csproj"' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { Split-Path $_.Groups[1].Value }
          if (-not $projects) { Write-Host "::error::Nu s-a găsit niciun proiect în LogAnalyzer.slnx"; exit 1 }
          $missing = $projects | Where-Object { -not (Test-Path (Join-Path $_ 'packages.lock.json')) }
          if ($missing) { Write-Host "::error::packages.lock.json lipsește pentru: $($missing -join ', ')"; exit 1 }
          Write-Host "OK: $($projects.Count) proiecte, fiecare cu packages.lock.json"

      - name: Restore (locked mode)
        run: dotnet restore LogAnalyzer.slnx --locked-mode

      # Security audit #9: any known-vulnerable package, direct or transitive, fails the build.
      - name: Vulnerable packages (direct and transitive)
        shell: pwsh
        run: |
          $out = (dotnet list LogAnalyzer.slnx package --vulnerable --include-transitive 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { Write-Host "::error::dotnet list package --vulnerable a eșuat (cod $code)"; exit 1 }
          if ($out -match 'has the following vulnerable packages') { Write-Host "::error::Pachete cu vulnerabilități cunoscute (vezi lista de mai sus)"; exit 1 }
          Write-Host "OK: niciun pachet vulnerabil cunoscut"

      - name: Build (Release)
        run: dotnet build LogAnalyzer.slnx --no-restore --configuration Release

      # The real incident corpus is never in the repository; corpus tests skip without LADFIR_CORPUS.
      - name: Test (Release)
        run: dotnet test LogAnalyzer.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=test-results"

      # Edition split (docs/dfir/EDITIONS.md): both executables were built by the solution build above; this step runs only the
      # inspection of the classified (P1) build output so a violation is named in its own step.
      - name: Classified edition contains no network, AI or host-modifying code
        run: dotnet test LogAnalyzer.Edition.Tests/LogAnalyzer.Edition.Tests.csproj --no-build --configuration Release

      # Failed tests become annotations: they are readable from the checks API without
      # downloading logs or artifacts.
      - name: Annotate failed tests
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter *.trx -ErrorAction SilentlyContinue
          $n = 0
          foreach ($file in $trx) {
            [xml]$doc = Get-Content -Raw $file.FullName
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            foreach ($r in (Select-Xml -Xml $doc -Namespace $ns -XPath '//t:UnitTestResult[@outcome="Failed"]')) {
              $msg = (Select-Xml -Xml $r.Node -Namespace $ns -XPath './/t:Message').Node.InnerText
              $msg = ($msg -replace "`r?`n", ' ')
              if ($msg.Length -gt 400) { $msg = $msg.Substring(0, 400) }
              Write-Host "::error title=Test failed::$($r.Node.testName) :: $msg"
              $n++
              if ($n -ge 40) { break }
            }
          }
          Write-Host "Failed tests annotated: $n"

      # Without the corpus the run is green but NOT a forensic validation; say so in the job summary.
      - name: Report forensic validation state
        if: always()
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter forensic_validation.txt -Path LogAnalyzer.Dfir.Tests/bin -ErrorAction SilentlyContinue | Select-Object -First 1
          $text = if ($f) { Get-Content -Raw $f.FullName } else { "FORENSIC VALIDATION = UNAVAILABLE (raportul nu a fost generat)" }
          Write-Host $text
          "## Forensic validation`n``````text`n$text`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($text -notmatch 'FORENSIC VALIDATION = AVAILABLE') { Write-Host "::warning::$(($text -split "`n")[0])" }

      # ---- Release gate (contract section 22; owner decisions 7 and 8) -------------------------------------------------------
      # Pull requests and pushes to main: REPORT mode (prints the matrix, uploads it, never fails the build). A release tag or a
      # manual dispatch with enforce_gate: ENFORCE mode, which fails unless every item is PASS or WAIVED.
      - name: Release gate self-test
        if: always()
        shell: pwsh
        run: ./release-gate/tests/Test-ReleaseGate.ps1

      - name: Release gate (report)
        if: always() && github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.enforce_gate)
        shell: pwsh
        run: ./release-gate/Invoke-ReleaseGate.ps1 -Mode Report -Commit '${{ github.sha }}'

      - name: Release gate (enforce)
        if: always() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.enforce_gate))
        shell: pwsh
        env:
          GATE_TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GATE_INPUT_VERSION: ${{ inputs.gate_version }}
        run: |
          $v = if ($env:GATE_TAG_VERSION) { $env:GATE_TAG_VERSION -replace '^loganalyzer-v', '' } elseif ($env:GATE_INPUT_VERSION) { $env:GATE_INPUT_VERSION } else { $null }
          $gateArgs = @('-Mode', 'Enforce', '-Commit', '${{ github.sha }}')
          if ($v) { $gateArgs += @('-Version', $v) }
          ./release-gate/Invoke-ReleaseGate.ps1 @gateArgs

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loganalyzer-release-gate
          path: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/release-gate/out/gate-report.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loganalyzer-test-results
          path: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Package ${{ matrix.edition }}
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: LogAnalyzer            # unclassified (P2/P3)
            project: LogAnalyzer.App/LogAnalyzer.App.csproj
            artifact: LogAnalyzer-win-x64
          - edition: LogAnalyzer.Classified # classified (P1)
            project: LogAnalyzer.App.Classified/LogAnalyzer.App.Classified.csproj
            artifact: LogAnalyzer-Classified-win-x64
    env:
      EDITION: ${{ matrix.edition }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/global.json

      - name: Publish (win-x64 self-contained single-file)
        run: dotnet publish ${{ matrix.project }} -c Release -p:PublishProfile=win-x64-singlefile

      - name: Verify publish output
        shell: pwsh
        run: |
          $out = "publish/$env:EDITION/win-x64"
          $exe = Get-ChildItem "$out/$env:EDITION.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Host "::error::Nu există $env:EDITION.exe în $out"; exit 1 }
          Write-Host "OK: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          if (-not (Test-Path "$out/Categories")) { Write-Host "::error::Categories lipsește din $out"; exit 1 }
          if (Test-Path "$out/license.lic") { Write-Host "::error::license.lic nu trebuie livrat în pachet"; exit 1 }
          # Security audit #5: native libraries next to the exe (no self-extraction) and their SHA-256 manifest, checked at startup.
          if (-not (Test-Path "$out/native-libraries.sha256")) { Write-Host "::error::native-libraries.sha256 lipsește din $out"; exit 1 }
          if (-not (Test-Path "$out/e_sqlcipher.dll")) { Write-Host "::error::e_sqlcipher.dll nu este lângă executabil (auto-extragere activă?)"; exit 1 }

      # Decision 14: the package must run on a bare PC. No .NET on PATH, DOTNET_ROOT unset, outbound traffic blocked for the exe.
      - name: Smoke test of the published executable (no .NET, no network)
        shell: pwsh
        run: |
          # Run it the way it is installed: from a folder only Administrators/SYSTEM can write (under Program Files, ACLs inherited),
          # because the startup gate refuses to run elevated from a user-writable folder (security audit, native library check).
          $out = Join-Path $env:ProgramFiles "LogAnalyzerSmoke\$env:EDITION"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path "publish/$env:EDITION/win-x64/*" -Destination $out -Recurse -Force
          $exe = Join-Path $out "$env:EDITION.exe"
          Get-ChildItem Env: | Where-Object { $_.Name -like 'DOTNET*' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch 'dotnet' }) -join ';'
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { Write-Host "::error::dotnet is still on PATH"; exit 1 }
          New-NetFirewallRule -DisplayName "block-$env:EDITION" -Direction Outbound -Action Block -Program $exe | Out-Null
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', "--self-test-out=$report" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0) { Write-Host "::error::self-test exited with $($p.ExitCode)"; exit 1 }

      # Security audit #9: CycloneDX SBOM of the edition (packages from the lock files, project references followed), tool pinned in .config/dotnet-tools.json.
      - name: SBOM (CycloneDX)
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::dotnet tool restore a eșuat"; exit 1 }
          dotnet tool run dotnet-CycloneDX ${{ matrix.project }} --recursive --output sbom --filename "$env:EDITION.cdx.json" --output-format Json --disable-package-restore --set-name "$env:EDITION"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "sbom/$env:EDITION.cdx.json")) { Write-Host "::error::SBOM-ul nu a fost generat"; exit 1 }

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/publish/${{ matrix.edition }}/win-x64
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-sbom
          path: 02_PRODUCT/projects/workspaces/loganalyzer-dfir/sbom/${{ matrix.edition }}.cdx.json
          if-no-files-found: error
          retention-days: 90
