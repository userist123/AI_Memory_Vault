name: Prompt Master Eval

on:
  pull_request:
    paths:
      - "00_GOVERNANCE/coordination/PROMPT_MASTER_TABLE.md"
      - "00_GOVERNANCE/coordination/PROMPT_MASTER_PORTABLE.md"
      - "00_GOVERNANCE/coordination/prompt_master_routing.json"
      - "07_EVALUATION/prompting/**"
      - "30_SCRIPTS/prompt/prompt_master_eval.py"
      - "20_TESTS/test_prompt_master_eval.py"
      - ".github/workflows/prompt-master-eval.yml"
  push:
    branches:
      - main
    paths:
      - "00_GOVERNANCE/coordination/PROMPT_MASTER_TABLE.md"
      - "00_GOVERNANCE/coordination/PROMPT_MASTER_PORTABLE.md"
      - "00_GOVERNANCE/coordination/prompt_master_routing.json"
      - "07_EVALUATION/prompting/**"
      - "30_SCRIPTS/prompt/prompt_master_eval.py"
      - "20_TESTS/test_prompt_master_eval.py"
      - ".github/workflows/prompt-master-eval.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prompt-master-eval:
    name: Prompt Master golden set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test runner
        # pyyaml: 20_TESTS/conftest.py imports the storage engine
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3

      - name: Golden set and docs gate
        run: python 30_SCRIPTS/prompt/prompt_master_eval.py check --json prompt-master-report.json

      - name: Evaluator tests
        run: python -m pytest 20_TESTS/test_prompt_master_eval.py -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prompt-master-report
          path: prompt-master-report.json
          if-no-files-found: ignore
