name: Exempt area secret scan

on:
  push:
    timeout-minutes: 20
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-exempt-areas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Scan the paths gitleaks is told to skip
        run: python 30_SCRIPTS/verification/exempt_area_secret_scan.py
