name: Exempt area secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the checked-out tree.
permissions:
  contents: read

jobs:
  scan-exempt-areas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan the paths gitleaks is told to skip
        run: python 30_SCRIPTS/verification/exempt_area_secret_scan.py
