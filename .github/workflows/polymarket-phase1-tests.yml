name: Polymarket Phase 1 Tests

on:
  push:
    branches:
      - 'r046/polymarket-phase1-market-snapshots'
    paths:
      - '03_IMPLEMENTATION/packages/polymarket/**'
      - '20_TESTS/polymarket/**'
      - '07_EVALUATION/polymarket/fixtures/**'
      - '.github/workflows/polymarket-phase1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    name: Phase 1 snapshot contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Phase 1 tests
        run: python -m pytest -q 20_TESTS/polymarket/test_market_snapshot.py
