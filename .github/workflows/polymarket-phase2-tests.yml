name: Polymarket Phase 2 Tests

on:
  push:
    branches:
      - 'r048-pm-phase2-replay'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    name: Phase 2 historical replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Phase 1 and Phase 2 tests
        run: python -m pytest -q 20_TESTS/polymarket/test_market_snapshot.py 20_TESTS/polymarket/test_historical_replay.py
