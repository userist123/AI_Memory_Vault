name: R009b Held-out Retrieval Benchmark

on:
  push:
    timeout-minutes: 20
    branches:
      # `main` is here because the full suite ran only on pull requests: after a
      # merge nothing re-ran it, so main could be green on its narrow workflows
      # while the zero-regression gate was failing.
      - main
      - 'r009b/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-heldout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Zero-regression gate
        run: |
          python -m pytest 20_TESTS -q
      # v1 is not run. 07_EVALUATION/heldout_retrieval_benchmark_v2/CONTRACT.md
      # records why: every one of v1's 36 held-out and 12 dev cases referenced
      # one of two gold notes that do not exist in the vault, so its recall is
      # structurally zero. VAULT_STATE.md marks it INVALID.
      #
      # It also could not pass: validate_schema() requires `expected_answer`
      # regardless of its `heldout` flag, and dev.json has never had that
      # field, so the step failed on every commit since 29daa115f. A gate that
      # cannot pass teaches everyone to ignore the colour of CI, and this one
      # would have measured nothing even if it had.
      - name: Held-out benchmark v2 (production arms)
        run: |
          python 07_EVALUATION/heldout_retrieval_benchmark_v2/run_production_arms.py             > 07_EVALUATION/heldout_retrieval_benchmark_v2/r016_ci_arms.json
      - name: Benchmark results
        run: |
          cat 07_EVALUATION/heldout_retrieval_benchmark_v2/r016_ci_arms.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r009b-heldout-v2-${{ github.sha }}
          path: |
            07_EVALUATION/heldout_retrieval_benchmark_v2/r016_ci_arms.json
