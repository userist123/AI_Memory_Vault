name: Polymarket Phase 15 Provenance Adapter Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase15-provenance-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 03_IMPLEMENTATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 15 provenance adapter tests
        run: python -m pytest -q 20_TESTS/polymarket/test_temporal_provenance_adapter.py
