name: Polymarket Phase 15 Provenance Adapter Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase15-provenance-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 03_IMPLEMENTATION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 15 provenance adapter tests
        run: python -m pytest -q 20_TESTS/polymarket/test_temporal_provenance_adapter.py
