name: R001 Repository Enforcement

on:
  push:
    branches: [main]
    paths:
      - '03_IMPLEMENTATION/**'
      - '04_CONFIG/**'
      - '06_INBOX/**'
      - '09_SECURITY/**'
      - 'security/**'
      - '20_TESTS/**'
      - '30_SCRIPTS/verification/**'
      - '40_EXPERIMENTS/**'
      - '99_META/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements-memory-v6.txt'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/r001-enforcement.yml'
  pull_request:
    branches: [main]
    paths:
      - '03_IMPLEMENTATION/**'
      - '04_CONFIG/**'
      - '06_INBOX/**'
      - '09_SECURITY/**'
      - 'security/**'
      - '20_TESTS/**'
      - '30_SCRIPTS/verification/**'
      - '40_EXPERIMENTS/**'
      - '99_META/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'requirements-memory-v6.txt'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/r001-enforcement.yml'

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R001_DIR: ${{ runner.temp }}/r001
    steps:
      - name: Checkout exact evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Neutralize stale gitlink before checkout cleanup
        shell: bash
        run: git update-index --force-remove -- '04_CONFIG/obsidian/AI_Memory_Vault_OBSIDIAN' 2>/dev/null || true

      - name: Runtime evidence header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R001_DIR"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" | tee "$R001_DIR/r001_sha.txt"
          printf 'timestamp_utc=%s\n' "$(date -u +%FT%TZ)" | tee -a "$R001_DIR/r001_sha.txt"
          python --version | tee "$R001_DIR/r001_python.txt"
          uname -a | tee "$R001_DIR/r001_platform.txt"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-memory-v6.txt
          python -m pip check

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          python 30_SCRIPTS/verification/validate_repository_layout.py | tee "$R001_DIR/r001_layout.txt"

      - name: Clean import smoke
        shell: bash
        run: |
          set -euo pipefail
          python -c "import memory_vault; import memory_vault.memory; import memory_vault.graph"

      - name: Targeted graph and trust tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q 20_TESTS/regression/test_spreading_activation_edge_weights.py 20_TESTS/adversarial/test_review_memory_instruction_injection.py 20_TESTS/integration/test_repository_layout.py 20_TESTS/integration/test_memory_vault_import.py 20_TESTS/regression/test_repository_hygiene.py | tee "$R001_DIR/r001_targeted_tests.txt"

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q | tee "$R001_DIR/r001_full_pytest.txt"

      - name: Current-tree gitleaks (fail closed)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -v "$R001_DIR:/evidence" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --config=/repo/.gitleaks.toml --no-git --no-banner --redact --verbose --report-format json --report-path /evidence/r001_gitleaks_current.json 2>&1 | tee "$R001_DIR/r001_gitleaks_current.txt"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0

      - name: Git-history gitleaks (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # The repository currently contains a very large number of paths/renames.
          # Keep Git's rename detection explicit so the CI scan is deterministic and
          # does not emit the default diff.renameLimit warning.
          git config --global diff.renameLimit 100000
          git config --global diff.renames true
          docker run --rm -w /repo -v "$PWD:/repo" -v "$R001_DIR:/evidence" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --config=/repo/.gitleaks.toml --report-format json --report-path /evidence/r001_gitleaks_history.json --redact --exit-code 1 2>&1 | tee "$R001_DIR/r001_gitleaks_history.txt"

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-memory-v6.txt | tee "$R001_DIR/r001_pip_audit.txt"
          pip-audit | tee "$R001_DIR/r001_pip_audit_environment.txt"

      - name: Build machine-readable inventory
        shell: bash
        run: |
          set -euo pipefail
          python 30_SCRIPTS/verification/build_r001_inventory.py | tee "$R001_DIR/r001_inventory.txt"

      - name: Evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "python=$(python --version 2>&1)"
            echo "platform=$(uname -a)"
            echo "tracked_files=$(git ls-files | wc -l)"
          } | tee "$R001_DIR/r001_evidence_manifest.txt"

      - name: Upload R001 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r001-enforcement-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/r001/r001_*.txt
            ${{ runner.temp }}/r001/r001_gitleaks_current.json
            ${{ runner.temp }}/r001/r001_gitleaks_history.json
            03_IMPLEMENTATION/products/xau_kinetic/repository_map/R001_RUNTIME_MIGRATION_INVENTORY.json
          if-no-files-found: warn
