name: R001 Repository Enforcement

on:
  push:
    branches: ["main"]
    paths:
      - "03_IMPLEMENTATION/**"
      - "04_CONFIG/**"
      - "06_INBOX/**"
      - "09_SECURITY/**"
      - "20_TESTS/**"
      - "30_SCRIPTS/verification/**"
      - "40_EXPERIMENTS/**"
      - "99_META/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements-memory-v6.txt"
      - ".gitleaks.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/r001-enforcement.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "03_IMPLEMENTATION/**"
      - "04_CONFIG/**"
      - "06_INBOX/**"
      - "09_SECURITY/**"
      - "20_TESTS/**"
      - "30_SCRIPTS/verification/**"
      - "40_EXPERIMENTS/**"
      - "99_META/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements-memory-v6.txt"
      - ".gitleaks.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/r001-enforcement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact evaluated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Runtime evidence header
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" | tee r001_sha.txt
          printf 'timestamp_utc=%s\n' "$(date -u +%FT%TZ)" | tee -a r001_sha.txt
          python --version | tee r001_python.txt
          uname -a | tee r001_platform.txt

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-memory-v6.txt
          python -m pip check

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          python 30_SCRIPTS/verification/validate_repository_layout.py | tee r001_layout.txt

      - name: Clean import smoke
        shell: bash
        run: |
          set -euo pipefail
          python -c "import memory_vault; import memory_vault.memory; import memory_vault.graph"

      - name: Targeted graph and trust tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q 20_TESTS/regression/test_spreading_activation_edge_weights.py 20_TESTS/adversarial/test_review_memory_instruction_injection.py 20_TESTS/integration/test_repository_layout.py 20_TESTS/integration/test_memory_vault_import.py 20_TESTS/regression/test_repository_hygiene.py | tee r001_targeted_tests.txt

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q | tee r001_full_pytest.txt

      - name: Current-tree gitleaks (fail closed)
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --no-git --no-banner --redact --verbose --report-format json --report-path /repo/r001_gitleaks_current.json 2>&1 | tee r001_gitleaks_current.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0

      - name: Git-history gitleaks (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --report-format json --report-path /repo/r001_gitleaks_history.json --redact --exit-code 1 2>&1 | tee r001_gitleaks_history.txt

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip-audit
          pip-audit -r requirements-memory-v6.txt | tee r001_pip_audit.txt

      - name: Build machine-readable inventory
        shell: bash
        run: |
          set -euo pipefail
          python 30_SCRIPTS/verification/build_r001_inventory.py | tee r001_inventory.txt

      - name: Evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "python=$(python --version 2>&1)"
            echo "platform=$(uname -a)"
            echo "layout_command=python 30_SCRIPTS/verification/validate_repository_layout.py"
            echo "targeted_command=pytest -q 20_TESTS/regression/test_spreading_activation_edge_weights.py 20_TESTS/adversarial/test_review_memory_instruction_injection.py 20_TESTS/integration/test_repository_layout.py 20_TESTS/integration/test_memory_vault_import.py 20_TESTS/regression/test_repository_hygiene.py"
            echo "full_test_command=pytest -q"
            echo "dataset=repository tracked tree at commit $(git rev-parse HEAD)"
            echo "status=SEE_STEP_LOGS"
          } > r001_evidence_manifest.txt

      - name: Upload R001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r001-enforcement-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            r001_*.txt
            r001_gitleaks_current.json
            r001_gitleaks_history.json
            03_IMPLEMENTATION/products/xau_kinetic/repository_map/R001_RUNTIME_MIGRATION_INVENTORY.json
          if-no-files-found: warn
