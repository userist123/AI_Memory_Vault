name: ACTIVE note integrity

on:
  push:
    timeout-minutes: 20
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-active-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Verify the ACTIVE notes against the recorded digests
        run: python 30_SCRIPTS/verification/active_note_integrity.py
      - name: Guard tests
        run: python -m pytest 20_TESTS/test_active_note_integrity.py -q
