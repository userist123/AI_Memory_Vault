name: Vault access routes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routes-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Route registry and access policy
        run: python 30_SCRIPTS/routing/build_route_manifest.py --check --summary
      - name: Vault access tests (core, adversarial, Ollama/Telegram, clients, MCP stdio)
        env:
          AI_MEMORY_VAULT_HOME: ${{ runner.temp }}/vault-state
        run: |
          python -m pytest -q \
            20_TESTS/test_vault_access_core.py \
            20_TESTS/test_vault_access_ollama_telegram.py \
            20_TESTS/test_vault_access_clients.py \
            20_TESTS/test_vault_access_perf.py \
            20_TESTS/test_agent_docs_memory_interfaces.py \
            20_TESTS/test_memory_mcp_server.py
