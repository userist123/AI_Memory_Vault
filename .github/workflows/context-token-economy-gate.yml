name: Context Token Economy Gate

on:
  pull_request:
    timeout-minutes: 20
    paths:
      - "03_IMPLEMENTATION/packages/retrieval/context/**"
      - "security/context_compression.py"
      - "security/tests/test_context_token_economy_gate.py"
      - ".github/workflows/context-token-economy-gate.yml"
  push:
    branches:
      - main
      - "codex/skill-exfiltration-scanner"
    paths:
      - "03_IMPLEMENTATION/packages/retrieval/context/**"
      - "security/context_compression.py"
      - "security/tests/test_context_token_economy_gate.py"
      - ".github/workflows/context-token-economy-gate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context-token-economy:
    name: Context Token Economy Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run executable token economy gate
        env:
          PYTHONPATH: .
        run: python -m pytest security/tests/test_context_token_economy_gate.py -q
