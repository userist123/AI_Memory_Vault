name: Memory V6 Tests

on:
  push:
    paths:
      - 'cognitive_core/**'
      - 'memory_controller/**'
      - 'tests/**'
      - 'requirements-memory-v6.txt'
      - '.github/workflows/memory-v6-tests.yml'
  pull_request:
    paths:
      - 'cognitive_core/**'
      - 'memory_controller/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    name: Run pytest for Memory V6 (cognitive_core, memory_controller, tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-memory-v6.txt

      - name: Run Memory V6 test suite
        run: pytest cognitive_core/tests memory_controller/tests tests/ -v

  regenerate-skill-catalog:
    name: Regenerate canonical skill catalog
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate catalog from physical skill directories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.agents/skills')
          catalog_path = Path('01_KNOWLEDGE/Master_Skills_Catalog_251.md')

          # A physical skill directory is a top-level directory that owns a SKILL.md.
          # Packaging/namespace wrappers (for example skillsweb/) are not skill entries.
          dirs = sorted(p for p in root.iterdir() if p.is_dir() and (p / 'SKILL.md').is_file())
          names = [p.name for p in dirs]

          if len(names) != len(set(names)):
              raise SystemExit('Duplicate top-level skill directory names detected')

          entries = []
          for directory in dirs:
              skill_path = directory / 'SKILL.md'

              # Tier 1: read only the YAML frontmatter block, then only description/tags.
              text = skill_path.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  raise SystemExit(f'No YAML frontmatter: {skill_path}')
              end = text.find('\n---', 3)
              if end < 0:
                  raise SystemExit(f'Unterminated YAML frontmatter: {skill_path}')
              frontmatter = text[4:end]

              description = ''
              tags = []
              lines = frontmatter.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  m = re.match(r'^description:\s*(.*)$', line)
                  if m:
                      value = m.group(1).strip()
                      continuation = []
                      j = i + 1
                      while j < len(lines) and (lines[j].startswith('  ') or lines[j].startswith('\t')):
                          continuation.append(lines[j].strip())
                          j += 1
                      if continuation:
                          value = ' '.join([value] + continuation)
                          i = j - 1
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\"', "'"}:
                          value = value[1:-1]
                      description = ' '.join(value.split())

                  m = re.match(r'^tags:\s*(.*)$', line)
                  if m:
                      value = m.group(1).strip()
                      if value.startswith('[') and value.endswith(']'):
                          inner = value[1:-1]
                          tags = []
                          for item in re.split(r',\s*', inner):
                              item = item.strip()
                              if len(item) >= 2 and item[0] == item[-1] and item[0] in {'\"', "'"}:
                                  item = item[1:-1]
                              if item:
                                  tags.append(item)
                      elif value:
                          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'\"', "'"}:
                              value = value[1:-1]
                          tags = [value]
                  i += 1

              entries.append((directory.name, description, tags))

          directory_count = len(dirs)
          entry_count = len(entries)
          if directory_count != entry_count:
              raise SystemExit(f'ACCEPTANCE FAILED: directories={directory_count}; entries={entry_count}')

          generated = [
              '---',
              'id: "cat-skills-251-master"',
              'type: knowledge',
              'lifecycle: ACTIVE',
              'category: skills-catalog',
              'tags: [skills, catalog, local-corpus, generated-from-directories]',
              'provenance:',
              '  source_type: repository-scan',
              '  source_ref: "userist123/AI_Memory_Vault_CODEX_READY/.agents/skills/"',
              '  source_commit: "' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '"',
              'confidence: very_high',
              'verification: verified',
              'relations:',
              '  - "01_KNOWLEDGE/Agents_Skill_Matrix.md"',
              '  - "00_CORE/GRAPH/14 Subagents Council Map.md"',
              '---',
              '',
              '# 📦 Catalog Canonic: Skills reale din `.agents/skills/`',
              '',
              'Sursă: directoarele fizice de top-level care conțin `SKILL.md` în `.agents/skills/`.',
              'Pentru fiecare skill sunt păstrate doar `description` și `tags` din YAML frontmatter-ul `SKILL.md`.',
              '',
              f'**Directoare reale:** {directory_count}  |  **Intrări catalog:** {entry_count}  |  **Diferență:** {directory_count - entry_count}',
              '',
              '| # | Skill | Path | Description | Tags |',
              '|---:|---|---|---|---|',
          ]

          for index, (name, description, tags) in enumerate(entries, 1):
              safe_description = description.replace('|', '\\|')
              safe_tags = ', '.join(tags).replace('|', '\\|')
              generated.append(f'| {index:03d} | `{name}` | `.agents/skills/{name}` | {safe_description} | {safe_tags} |')

          catalog_path.write_text('\n'.join(generated) + '\n', encoding='utf-8')

          rendered = catalog_path.read_text(encoding='utf-8')
          catalog_names = re.findall(
              r'^\|\s*\d+\s*\|\s*`([^`]+)`\s*\|\s*`\.agents/skills/[^`]+`\s*\|',
              rendered,
              flags=re.M,
          )
          if catalog_names != names:
              raise SystemExit('ACCEPTANCE FAILED: catalog names do not exactly match sorted physical skill directories')

          print(f'REAL_DIRECTORIES={directory_count}')
          print(f'NEW_CATALOG_ENTRIES={entry_count}')
          print(f'DIFFERENCE={directory_count-entry_count}')
          PY

      - name: Commit regenerated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_KNOWLEDGE/Master_Skills_Catalog_251.md
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate skill catalog from physical skill directories'
          git push origin HEAD:main
