name: Memory V6 Tests

on:
  push:
    timeout-minutes: 20
    paths:
      - '03_IMPLEMENTATION/**'
      - '20_TESTS/memory_controller/**'
      - 'requirements-memory-v6.txt'
      - '.github/workflows/memory-v6-tests.yml'
  pull_request:
    paths:
      - '03_IMPLEMENTATION/**'
      - '20_TESTS/memory_controller/**'
      - 'requirements-memory-v6.txt'
      - '.github/workflows/memory-v6-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Memory V6 controller tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          persist-credentials: false
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-memory-v6.txt

      - name: Run Memory V6 controller tests
        env:
          PYTHONPATH: .
        run: pytest 20_TESTS/memory_controller -v
