name: Memory V6 Tests

on:
  push:
    paths:
      - 'cognitive_core/**'
      - 'memory_controller/**'
      - 'requirements-memory-v6.txt'
      - '.github/workflows/memory-v6-tests.yml'
  pull_request:
    paths:
      - 'cognitive_core/**'
      - 'memory_controller/**'
      - 'requirements-memory-v6.txt'
      - '.github/workflows/memory-v6-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run pytest for Memory V6 (cognitive_core + memory_controller)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-memory-v6.txt

      - name: Run Memory V6 test suite
        run: pytest cognitive_core/tests memory_controller/tests -v
