name: Polymarket Phase 12 Tests

on:
  push:
    branches:
      - r064
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase12:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 03_IMPLEMENTATION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Run Phase 12 temporal contract and regression
        run: |
          python -m pytest -q \
            20_TESTS/polymarket/test_phase12_temporal_contract.py \
            20_TESTS/polymarket/test_historical_paper_replay.py \
            20_TESTS/polymarket/test_market_model_edge.py \
            20_TESTS/polymarket/test_prediction_ledger.py
