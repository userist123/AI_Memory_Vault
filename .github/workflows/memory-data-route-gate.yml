name: Memory Data Route Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/skill-exfiltration-scanner"

jobs:
  memory-data-route:
    name: Memory Data Route Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run canonical data-route gate
        env:
          PYTHONPATH: .
        run: python -m pytest security/tests/test_canonical_memory_data_route.py -q
