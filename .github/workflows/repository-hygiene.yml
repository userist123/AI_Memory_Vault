name: Repository Hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Structural and path hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run repository hygiene validator
        run: python 30_SCRIPTS/verification/repository_hygiene.py

      - name: Run hygiene regression tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest 20_TESTS/regression/test_repository_hygiene.py -q
