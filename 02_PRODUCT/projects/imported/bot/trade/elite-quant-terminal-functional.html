<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>elite-quant-terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: .25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem; --space-12:3rem;
      --radius-sm:.375rem; --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem; --radius-full:999px;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --color-bg:#111315; --color-surface:#171a1d; --color-surface-2:#1d2126; --color-surface-offset:#20262b; --color-surface-offset-2:#262d34;
      --color-border:rgba(255,255,255,.08); --color-divider:rgba(255,255,255,.06);
      --color-text:#edf2f7; --color-text-muted:#9eabb8; --color-text-faint:#758190; --color-text-inverse:#0d1013;
      --color-primary:#d4a94d; --color-primary-hover:#e6be67; --color-primary-highlight:rgba(212,169,77,.12);
      --color-success:#45b36b; --color-error:#d35c67; --color-warning:#e09a3b; --color-blue:#59a7ff; --color-purple:#ab7cff;
      --shadow-sm:0 1px 2px rgba(0,0,0,.18); --shadow-md:0 8px 18px rgba(0,0,0,.22); --shadow-lg:0 18px 40px rgba(0,0,0,.35);
      --font-body:'Inter',system-ui,sans-serif; --font-display:'Inter',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100vh;font-family:var(--font-body);font-size:var(--text-base);background:radial-gradient(circle at top right, rgba(212,169,77,.08), transparent 20%), var(--color-bg);color:var(--color-text)}
    img,svg,canvas{display:block;max-width:100%}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:none;background:none}
    a{text-decoration:none;color:inherit}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
    .sidebar{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));border-right:1px solid var(--color-border);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);position:sticky;top:0;height:100vh}
    .logo{display:flex;align-items:center;gap:var(--space-3)}
    .logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg, rgba(212,169,77,.25), rgba(212,169,77,.07));display:grid;place-items:center;border:1px solid rgba(212,169,77,.22);box-shadow:var(--shadow-sm)}
    .logo h1{font-size:1rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .logo small{color:var(--color-text-muted);font-size:var(--text-xs)}
    .nav{display:flex;flex-direction:column;gap:var(--space-2)}
    .nav button{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-radius:var(--radius-lg);background:transparent;border:1px solid transparent;transition:all var(--transition-interactive);text-align:left}
    .nav button.active,.nav button:hover{background:var(--color-primary-highlight);border-color:rgba(212,169,77,.18)}
    .nav .tag{font-size:var(--text-xs);color:var(--color-text-faint)}
    .side-card{padding:var(--space-4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);display:grid;gap:var(--space-3)}
    .side-card h3{font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-muted)}
    .main{display:flex;flex-direction:column;min-width:0}
    .topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-6);background:rgba(17,19,21,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--color-border)}
    .topbar-left,.topbar-right{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .8rem;border-radius:var(--radius-full);background:var(--color-surface);border:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-muted)}
    .dot{width:8px;height:8px;border-radius:999px;background:var(--color-success);box-shadow:0 0 0 4px rgba(69,179,107,.15)}
    .button{padding:.82rem 1rem;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border);transition:all var(--transition-interactive);font-weight:600}
    .button:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.14)}
    .button.primary{background:linear-gradient(180deg, rgba(212,169,77,.2), rgba(212,169,77,.12));border-color:rgba(212,169,77,.3)}
    .button.danger{background:rgba(211,92,103,.12);border-color:rgba(211,92,103,.22)}
    .content{padding:var(--space-6);display:grid;gap:var(--space-6);overflow:auto}
    .view{display:none;gap:var(--space-6)}
    .view.active{display:grid}
    .hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
    .stat-card,.panel{background:linear-gradient(180deg, rgba(255,255,255,.015), rgba(255,255,255,.005));border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)}
    .stat-card{padding:var(--space-4);display:grid;gap:.45rem}
    .stat-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-faint)}
    .stat-value{font-size:1.7rem;font-weight:800;line-height:1}
    .positive{color:var(--color-success)} .negative{color:var(--color-error)} .warning{color:var(--color-warning)} .blue{color:var(--color-blue)}
    .grid-3{display:grid;grid-template-columns:1.15fr 1.15fr .85fr;gap:var(--space-4)}
    .grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--space-4)}
    .panel{padding:var(--space-4);display:grid;gap:var(--space-4)}
    .panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3)}
    .panel-title{display:grid;gap:.2rem}
    .panel-title h2{font-size:var(--text-lg);font-weight:700}
    .panel-title p{font-size:var(--text-sm);color:var(--color-text-muted);max-width:72ch}
    .mono{font-feature-settings:"tnum" 1,"ss01" 1;font-variant-numeric:tabular-nums}
    .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
    .kv div{padding:.9rem;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface)}
    .kv small{display:block;color:var(--color-text-faint);font-size:var(--text-xs);margin-bottom:.3rem}
    .table-wrap{overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-lg)}
    table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
    th,td{padding:.85rem .8rem;text-align:left;border-bottom:1px solid var(--color-divider);white-space:nowrap}
    th{color:var(--color-text-faint);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.02)}
    tr:hover td{background:rgba(255,255,255,.02)}
    .ladder{display:grid;gap:var(--space-3)}
    .ladder-bar{position:relative;height:70px;border-radius:18px;background:linear-gradient(90deg, rgba(211,92,103,.12) 0 28%, rgba(255,255,255,.04) 28% 48%, rgba(69,179,107,.09) 48% 100%);border:1px solid var(--color-border);overflow:hidden}
    .ladder-line{position:absolute;top:10px;bottom:10px;width:2px;background:rgba(255,255,255,.6)}
    .ladder-line::after{content:attr(data-label);position:absolute;top:-2px;left:8px;font-size:11px;color:var(--color-text-muted);white-space:nowrap}
    .current-price{position:absolute;top:0;bottom:0;width:3px;background:var(--color-primary);box-shadow:0 0 0 6px rgba(212,169,77,.12)}
    .current-price::after{content:'NOW';position:absolute;top:45px;left:-10px;background:var(--color-primary);color:var(--color-text-inverse);padding:2px 6px;border-radius:999px;font-size:10px;font-weight:800}
    .mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
    .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .65rem;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .chip.green{background:rgba(69,179,107,.12);color:var(--color-success)}
    .chip.red{background:rgba(211,92,103,.12);color:var(--color-error)}
    .chip.gold{background:rgba(212,169,77,.14);color:var(--color-primary)}
    .chip.blue{background:rgba(89,167,255,.12);color:var(--color-blue)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
    .field{display:grid;gap:.45rem;padding:var(--space-4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
    .field label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-faint)}
    .field input,.field select,.field textarea{background:var(--color-surface-offset);border:1px solid var(--color-border);padding:.85rem .9rem;border-radius:var(--radius-md)}
    .field p{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.5}
    .field .advanced{color:var(--color-text-faint)}
    .toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
    .toggle input{accent-color:var(--color-primary)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
    .logs{max-height:320px;overflow:auto;display:grid;gap:.55rem;padding-right:.25rem}
    .log-entry{padding:.75rem .85rem;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border);font-size:var(--text-sm);display:flex;justify-content:space-between;gap:var(--space-3)}
    .muted{color:var(--color-text-muted)}
    .spark{display:flex;gap:4px;align-items:flex-end;height:38px}
    .spark span{width:8px;border-radius:999px 999px 2px 2px;background:rgba(255,255,255,.08)}
    .spark span.win{background:rgba(69,179,107,.7)} .spark span.loss{background:rgba(211,92,103,.7)}
    .report-list{display:grid;gap:var(--space-3)}
    .report-item{padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
    .chart{height:210px;border-radius:var(--radius-lg);background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));border:1px solid var(--color-border);padding:var(--space-3);display:flex;align-items:flex-end;gap:10px;overflow:hidden}
    .bar{flex:1;background:linear-gradient(180deg, rgba(212,169,77,.8), rgba(212,169,77,.3));border-radius:10px 10px 0 0;position:relative;min-width:18px}
    .bar.red{background:linear-gradient(180deg, rgba(211,92,103,.82), rgba(211,92,103,.25))}
    .bar::after{content:attr(data-label);position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--color-text-faint)}
    .line-chart{height:220px;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));position:relative;overflow:hidden}
    .line-chart svg{width:100%;height:100%}
    .tabs{display:flex;gap:var(--space-2);flex-wrap:wrap}
    .tabs button{padding:.6rem .8rem;border-radius:999px;border:1px solid var(--color-border);background:var(--color-surface);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em}
    .tabs button.active{background:var(--color-primary-highlight);border-color:rgba(212,169,77,.25)}
    .status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
    .status-box{padding:var(--space-3);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border)}
    .status-box strong{display:block;margin-top:.45rem;font-size:var(--text-sm)}
    .footer-actions{display:flex;gap:var(--space-3);flex-wrap:wrap}
    .small{font-size:var(--text-xs)}
    .right{text-align:right}
    .danger-outline{border-color:rgba(211,92,103,.25)!important}
    @media (max-width: 1200px){.grid-3,.grid-2,.hero-grid,.status-grid,.form-grid,.split{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--color-border)}}
  </style>
</head>

<div class="app">
  <aside class="sidebar">

function fmt(n, d=2){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(n){ return `${n >= 0 ? '+' : ''}${fmt(n,2)}%`; }
function usd(n){ return `${n >= 0 ? '+' : ''}$${fmt(n,2)}`; }
function safeId(v){ return v.replace(/[^a-z0-9_]/gi,'_'); }
function pushLog(type, msg){
  state.logs.unshift({time:new Date().toLocaleTimeString('en-GB'), type, msg});
  state.logs = state.logs.slice(0, 40);
}
function riskAmount(){ return state.balance * state.config.RISK_PCT; }
function drawdownPct(){ return ((state.dailyRealized < 0 ? Math.abs(state.dailyRealized) : 0) / state.dayStartBalance) * 100; }
function dailyPnLPct(){ return (state.dailyRealized / state.dayStartBalance) * 100; }
function spreadOk(){ return state.spread <= state.spreadMA * state.config.XAU_SPREAD_MAX_RATIO; }
function dailyLossHit(){ return state.dailyRealized <= -(state.dayStartBalance * state.config.DAILY_LOSS_LIMIT_PCT); }
function marketAlive(){ return state.atrFast >= 0.5 * state.atrSlow; }
function mlAuthority(){ return state.mlTrainedSamples >= state.mlMinSamples ? 'HIGH' : 'LIMITED'; }
function canTrade(){
  if(!state.autoTrading || state.globalHalt) return [false, 'global_halt_or_auto_off'];
  if(dailyLossHit()) return [false, 'daily_loss_limit'];
  if(state.ordersToday >= state.config.MAX_ORDERS_PER_DAY) return [false, 'max_orders_day'];
  if(!spreadOk()) return [false, 'spread'];
  if(!marketAlive()) return [false, 'dead_market'];
  if(state.lastConsensus < state.config.ENSEMBLE_CONSENSUS_THRESHOLD) return [false, 'consensus'];
  if(state.lastMlProb < state.config.XAU_ML_THRESHOLD_TREND) return [false, 'ml_gate'];
  if(state.trades.length >= state.config.MAX_CONCURRENT_POSITIONS) return [false, 'max_positions'];
  return [true, 'trade_allowed'];
}

}

function ladderBar(trade){
  const low = trade.sl;
  const high = trade.tp[trade.tp.length-1];
  const pos = v => ((v-low)/(high-low))*100;
  return `
  <div class="ladder-bar">
    <div class="ladder-line" style="left:${pos(trade.sl)}%" data-label="SL ${trade.sl.toFixed(2)}"></div>
    <div class="ladder-line" style="left:${pos(trade.entry)}%" data-label="Entry ${trade.entry.toFixed(2)}"></div>
    <div class="ladder-line" style="left:${pos(trade.tp[0])}%" data-label="TP1 ${trade.tp[0].toFixed(2)}"></div>
    <div class="ladder-line" style="left:${pos(trade.tp[1])}%" data-label="TP2 ${trade.tp[1].toFixed(2)}"></div>
    <div class="ladder-line" style="left:${pos(trade.tp[2])}%" data-label="TP3 ${trade.tp[2].toFixed(2)}"></div>
    <div class="current-price" style="left:${pos(trade.price)}%"></div>
  </div>`;
}

  root.innerHTML = `
    <section class="panel">
      <div class="panel-header"><div class="panel-title"><h2>Config panel</h2><p>Every exposed field is editable, explained for juniors and justified for seniors. Changes are validated before apply.</p></div><div class="footer-actions"><button class="button primary" id="applyConfigBtn">Apply config changes</button></div></div>
      <div class="form-grid">
        ${keys.map(k=>{
          const meta = state.configMeta[k];
          const v = state.config[k];
          const value = Array.isArray(v) ? v.join(', ') : v;
          const hint = meta.min !== undefined ? `${meta.min} - ${meta.max}` : 'See note';
          const type = meta.type;
          return `<div class="field ${dangerous(k, v)?'danger-outline':''}">
            <label for="cfg_${k}">${k}</label>
            <input id="cfg_${k}" data-key="${k}" data-type="${type}" value="${value}">
            <p><strong>Type:</strong> ${type} | <strong>Allowed:</strong> ${hint}</p>
            <p>${meta.junior}</p>
            <p class="advanced">${meta.senior}</p>
            <div class="small" id="val_${k}">${validateField(k, value).msg}</div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
  root.querySelectorAll('input[data-key]').forEach(inp=>inp.addEventListener('input', ()=>{
    const key = inp.dataset.key;
    const res = validateField(key, inp.value);
    const node = document.getElementById(`val_${key}`);
    node.textContent = res.msg;
    node.className = `small ${res.ok ? 'positive' : 'negative'}`;
    inp.parentElement.classList.toggle('danger-outline', dangerous(key, inp.value));
  }));
  document.getElementById('applyConfigBtn').onclick = applyConfigChanges;
}

function dangerous(key, value){
  const parsed = parseValue(key, value);
  if(key === 'RISK_PCT' && parsed > 0.02) return true;
  if(key === 'DAILY_LOSS_LIMIT_PCT' && parsed > 0.05) return true;
  if(key === 'MAX_CONCURRENT_POSITIONS' && parsed > 3) return true;
  return false;
}
function parseValue(key, value){
  const meta = state.configMeta[key];
  if(!meta) return value;
  if(meta.type === 'float') return parseFloat(value);
  if(meta.type === 'int') return parseInt(value,10);
  if(meta.type === 'bool') return value === true || value === 'true';
  if(meta.type === 'list') return String(value).split(',').map(v=>v.trim()).filter(Boolean).map(v=> isNaN(Number(v)) ? v : Number(v));
  return value;
}
function validateField(key, value){
  const meta = state.configMeta[key];
  if(!meta) return {ok:false,msg:'Unknown field'};
  const parsed = parseValue(key, value);
  if(meta.type === 'float' && Number.isNaN(parsed)) return {ok:false,msg:'Invalid float'};
  if(meta.type === 'int' && Number.isNaN(parsed)) return {ok:false,msg:'Invalid integer'};
  if((meta.type === 'float' || meta.type === 'int') && meta.min !== undefined && (parsed < meta.min || parsed > meta.max)) return {ok:false,msg:`Out of range. Expected ${meta.min} to ${meta.max}`};
  if(key === 'TP_VOLUME_FRACTIONS'){
    const sum = parsed.reduce((a,b)=>a+Number(b),0);
    if(Math.abs(sum - 1) > 0.001) return {ok:false,msg:'Fractions must sum to 1.0'};
  }
  return {ok:true,msg:'Valid and ready to apply'};
}
function applyConfigChanges(){
  const fields = document.querySelectorAll('#view-config input[data-key]');
  const updates = {};
  for(const f of fields){
    const key = f.dataset.key;
    const res = validateField(key, f.value);
    if(!res.ok){ pushLog('config', `Rejected ${key}: ${res.msg}`); refresh(); return; }
    updates[key] = parseValue(key, f.value);
  }
  Object.assign(state.config, updates);
  state.maxOrdersPerDay = state.config.MAX_ORDERS_PER_DAY;
  pushLog('config', 'Applied validated config overrides');
  refresh();
}

function partialClose(i){
  const t = state.trades[i];
  if(!t) return;
  const closeVol = Math.max(0.01, t.volumeRemaining * 0.3);
  t.volumeRemaining = Math.max(0, +(t.volumeRemaining - closeVol).toFixed(3));
  t.pnl += 5.4;
  pushLog('execution', `Partial close executed on ${t.ticket}: ${closeVol.toFixed(3)} lots`);
  refresh();
}
function toggleStrategy(i, enabled){
  const s = state.strategies[i];
  s.enabled = enabled;
  s.status = enabled ? 'ACTIVE' : 'DISABLED';
  pushLog('strategy', `${s.id} manually ${enabled ? 'enabled' : 'disabled'}`);
  refresh();
}
function simulateMLUpdate(){
  state.mlTrainedSamples += 1;
  state.lastMlProb = Math.min(0.82, Math.max(0.48, state.lastMlProb + (Math.random() - 0.35) * 0.06));
  pushLog('ml', `Online model updated. Samples=${state.mlTrainedSamples}, prob=${state.lastMlProb.toFixed(2)}`);
  refresh();
}
function autoPruneWorst(){
  const worst = [...state.strategies].sort((a,b)=>a.expectancy-b.expectancy)[0];
  worst.enabled = false; worst.status = 'DISABLED';
  document.getElementById('reportFeedback').textContent = `Auto-pruned ${worst.id} based on weakest expectancy.`;
  pushLog('reports', `Auto-pruned strategy ${worst.id} from daily reports`);
  refresh();
}
function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function simulateTrade(){
  const [allowed, reason] = canTrade();
  if(!allowed){
    state.lastSkipReason = reason;
    pushLog('engine', `Trade blocked: ${reason}`);
    refresh();
    return;
  }
  const entry = +(state.xauPrice - 0.4).toFixed(2);
  const sl = +(entry - 3.3).toFixed(2);
  const tp1 = +(entry + 3.3).toFixed(2);
  const tp2 = +(entry + 6.1).toFixed(2);
  const tp3 = +(entry + 9.2).toFixed(2);
  const trade = {
    ticket:'#' + Math.floor(481222 + Math.random()*700), strategy:'trend_london_m5_01', side:'BUY', volumeInitial:0.08, volumeRemaining:0.08,
    entry, sl, tp:[tp1,tp2,tp3], ml:state.lastMlProb, pnl:0, r:0, price:state.xauPrice, tpHit:[false,false,false]
  };
  state.trades.unshift(trade);
  state.ordersToday += 1;
  pushLog('execution', `Simulated BUY opened at ${entry.toFixed(2)} with SL ${sl.toFixed(2)}`);
  refresh();
}
function runEvaluationLoop(){
  state.spread = +(Math.max(0.18, Math.min(0.65, state.spread + (Math.random()-0.5)*0.12))).toFixed(2);
  state.atrFast = +(Math.max(1.5, Math.min(4.4, state.atrFast + (Math.random()-0.5)*0.45))).toFixed(2);
  state.lastConsensus = +(Math.max(0.48, Math.min(0.87, state.lastConsensus + (Math.random()-0.45)*0.09))).toFixed(2);
  state.lastMlProb = +(Math.max(0.49, Math.min(0.78, state.lastMlProb + (Math.random()-0.45)*0.07))).toFixed(2);
  const [allowed, reason] = canTrade();
  state.lastSkipReason = allowed ? 'all_gates_pass' : reason;
  state.xauPrice = +(state.xauPrice + (Math.random()-0.47)*1.25).toFixed(2);
  state.trades.forEach(t=>{
    t.price = state.xauPrice;
    t.pnl = +((t.price - t.entry) * 7.4).toFixed(2);
    t.r = +((t.price - t.entry) / Math.abs(t.entry - t.sl)).toFixed(2);
    t.tp.forEach((tp, idx)=>{ if(!t.tpHit[idx] && t.price >= tp){ t.tpHit[idx] = true; pushLog('tp', `${t.ticket} hit TP${idx+1}`); } });
  });
  pushLog('engine', `Evaluation loop complete: ${allowed ? 'entry allowed' : 'blocked by ' + reason}`);
  refresh();
}

function renderLogs(targetId){
  const node = document.getElementById(targetId);
  if(!node) return;
  node.innerHTML = state.logs.map(l=>`<div class="log-entry"><span><strong>${l.type}</strong> — ${l.msg}</span><span class="muted small">${l.time}</span></div>`).join('');
}

function bindTopbar(){
  document.getElementById('themeBtn').onclick = ()=>{
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    pushLog('ui', `Theme switched to ${state.theme}`);
    refresh(false);
  };
  document.getElementById('startStopBtn').onclick = ()=>{
    state.autoTrading = !state.autoTrading;
    pushLog('engine', `Auto trading ${state.autoTrading ? 'enabled' : 'stopped'}`);
    refresh();
  };
  document.getElementById('toggleModeBtn').onclick = ()=>{
    state.mode = state.mode === 'PAPER' ? 'LIVE' : 'PAPER';
    pushLog('engine', `Execution mode changed to ${state.mode}`);
    refresh();
  };
  document.getElementById('killBtn').onclick = ()=>{
    state.globalHalt = !state.globalHalt;
    pushLog('risk', `Global halt ${state.globalHalt ? 'activated' : 'released'}`);
    refresh();
  };
}

function refresh(withRenders=true){
  updateEngineBadges();
  document.getElementById('startStopBtn').textContent = state.autoTrading ? 'Stop Auto' : 'Start Auto';
  if(withRenders){ renderDashboard(); renderTrades(); renderStrategies(); renderRisk(); renderML(); renderReports(); renderConfig(); }
}

renderNav();
bindTopbar();
pushLog('boot','Elite Quant Terminal initialized in fully interactive demo mode');
pushLog('session','Session state loaded: London/NY overlap with XAUUSD focus');
refresh();
</script>
</body>
