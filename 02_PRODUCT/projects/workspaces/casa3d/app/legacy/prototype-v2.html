<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa mea 3D — design interior automat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Vocabular vizual: planșă de arhitect — hârtie albă, grafit, cerneală albastră de marcaj */
:root{
  --paper:#FBFBF9; --paper-2:#F1F1EC; --graphite:#23262B; --lead:#5E636B; --rule:#D9DAD4;
  --ink:#1F4E79; --ink-2:#2E6DA4; --ok:#2F6B4F;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#FBFBF9; } }
:root[data-theme="dark"]{ --paper:#FBFBF9; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--paper); color:var(--graphite); font:400 14px/1.5 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--ink-2); outline-offset:2px}
#view{position:fixed; inset:0; width:100vw; height:100%; display:block; touch-action:none}
button{font:inherit; color:inherit; cursor:pointer}

/* bara de sus */
.top{position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); z-index:10; display:flex; align-items:center; gap:10px; pointer-events:none}
.brand{pointer-events:auto; display:flex; flex-direction:column; padding:8px 14px; background:rgba(251,251,249,.92); border:1px solid var(--rule); border-radius:10px; backdrop-filter:blur(8px)}
.brand b{font:600 15px/1.2 var(--sans)} .brand span{font:400 12px/1.3 var(--mono); color:var(--lead)}
.modes{pointer-events:auto; margin-left:auto; display:flex; padding:3px; background:rgba(251,251,249,.92); border:1px solid var(--rule); border-radius:10px}
.modes button{border:0; background:transparent; min-height:38px; padding:0 14px; border-radius:7px; font-weight:500}
.modes button[aria-pressed="true"]{background:var(--graphite); color:#fff}
.listbtn{pointer-events:auto; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:#fff; font-weight:500; display:flex; align-items:center; gap:8px}
.listbtn .n{font:500 12px/1 var(--mono); background:rgba(255,255,255,.18); padding:3px 7px; border-radius:6px}

/* camere */
.rooms{position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:10; display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; pointer-events:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button{pointer-events:auto; flex:none; min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--rule); background:rgba(251,251,249,.94); display:flex; flex-direction:column; justify-content:center; text-align:left; line-height:1.15}
.rooms button small{font:400 11px/1.2 var(--mono); color:var(--lead)}
.rooms button.on{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}

/* minimap plan */
.mini{position:fixed; right:12px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:10; width:200px; background:rgba(251,251,249,.94); border:1px solid var(--rule); border-radius:10px; padding:8px}
.mini svg{display:block; width:100%; height:auto}
.mini .cap{display:flex; justify-content:space-between; font:400 11px/1 var(--mono); color:var(--lead); margin-bottom:6px}

/* joystick mobil */
.joy{position:fixed; left:18px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:11; width:112px; height:112px; border-radius:50%; border:1px solid rgba(35,38,43,.25); background:rgba(251,251,249,.55); backdrop-filter:blur(6px); display:none; touch-action:none}
.joy i{position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:var(--graphite); opacity:.8}
body.walk.touch .joy{display:block}
.hint{position:fixed; left:50%; top:calc(78px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:9; background:rgba(35,38,43,.86); color:#fff; font-size:12.5px; padding:8px 12px; border-radius:8px; pointer-events:none; transition:opacity .6s; white-space:nowrap}

/* card produs */
.card{position:fixed; left:12px; top:calc(84px + env(safe-area-inset-top,0px)); z-index:12; width:min(320px, calc(100vw - 24px)); background:var(--paper); border:1px solid var(--graphite); border-radius:12px; padding:16px; box-shadow:0 20px 50px rgba(0,0,0,.18); display:none}
.card.on{display:block}
.card h3{margin:0 0 4px; font:600 16px/1.3 var(--sans)}
.card .store{font:400 12px/1.4 var(--mono); color:var(--lead)}
.card .price{font:600 24px/1.1 var(--sans); margin:12px 0 4px; font-variant-numeric:tabular-nums}
.card dl{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0 14px; font:400 12.5px/1.4 var(--mono)}
.card dt{color:var(--lead)}
.card .row{display:flex; gap:8px}
.card a,.card .x{min-height:42px; display:inline-flex; align-items:center; justify-content:center; padding:0 14px; border-radius:8px; text-decoration:none; font-weight:500}
.card a{background:var(--ink); color:#fff; flex:1} .card .x{border:1px solid var(--rule); background:#fff}

/* panou listă cumpărături */
.panel{position:fixed; top:0; right:0; bottom:0; z-index:20; width:min(460px, 100vw); background:var(--paper); border-left:1px solid var(--graphite); transform:translateX(102%); transition:transform .35s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.panel.on{transform:none}
.panel header{display:flex; align-items:flex-start; gap:12px; padding:18px 18px 12px; border-bottom:1px solid var(--rule)}
.panel header h2{margin:0; font:600 18px/1.25 var(--sans)} .panel header p{margin:4px 0 0; color:var(--lead); font-size:12.5px}
.panel header button{margin-left:auto; min-width:42px; min-height:42px; border-radius:8px; border:1px solid var(--rule); background:#fff; font-size:18px}
.panel .body{overflow:auto; padding:6px 18px 18px; flex:1}
.panel h4{margin:18px 0 6px; font:600 13px/1.3 var(--sans); display:flex; justify-content:space-between; border-bottom:1px solid var(--graphite); padding-bottom:6px}
.panel h4 span{font:500 12.5px/1.3 var(--mono)}
.item{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:9px 0; border-bottom:1px dashed var(--rule)}
.item a{color:var(--graphite); text-decoration:none; font-weight:500} .item a:hover{color:var(--ink); text-decoration:underline}
.item .meta{grid-column:1; font:400 11.5px/1.35 var(--mono); color:var(--lead)}
.item .p{grid-row:1 / span 2; grid-column:2; font:500 13px/1.3 var(--mono); text-align:right; font-variant-numeric:tabular-nums; align-self:center}
.totals{border-top:2px solid var(--graphite); padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px)); background:var(--paper-2)}
.totals .line{display:flex; justify-content:space-between; font:400 12.5px/1.8 var(--mono)}
.totals .grand{font:600 20px/1.3 var(--sans); display:flex; justify-content:space-between; margin-top:6px}
.totals small{display:block; color:var(--lead); font-size:11.5px; margin-top:8px; line-height:1.45}
.totals .acts{display:flex; gap:8px; margin-top:12px}
.totals .acts button{flex:1; min-height:42px; border-radius:8px; border:1px solid var(--graphite); background:#fff; font-weight:500}
.panel .note{margin:16px 0 0; padding:12px; border:1px solid var(--rule); border-radius:8px; font-size:12.5px; color:var(--lead); background:#fff}

.card{max-height:calc(100vh - 110px); overflow:auto}
.optsTitle{font:500 12px/1 var(--sans); color:var(--lead); margin:4px 0 8px}
.opts{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
.opt{display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; text-align:left; padding:8px 10px; border:1px solid var(--rule); border-radius:8px; background:#fff; min-height:48px}
.opt i{width:28px; height:28px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.opt b{display:block; font:500 12.5px/1.3 var(--sans)} .opt small{font:400 11px/1.3 var(--mono); color:var(--lead)}
.opt span.p{font:500 12.5px/1 var(--mono); white-space:nowrap}
.opt[aria-selected="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:#f3f7fb}
.opt.nofit{opacity:.45}
.tools{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.tools button,.nudge button{min-height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--graphite); background:#fff; font-weight:500}
.nudge{border:1px dashed var(--ink); border-radius:8px; padding:10px; margin-bottom:10px}
.nudge .gaps{font:400 12px/1.6 var(--mono); margin-bottom:8px}
.nudge .gaps b{color:var(--ink)} .nudge .gaps .bad{color:#b3261e}
.nudge .pad{display:flex; gap:6px; margin-bottom:8px}
.nudge .pad button{flex:1; font-size:16px}
.nudge .done{width:100%; background:var(--ink); color:#fff; border-color:var(--ink)}
.toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; background:var(--graphite); color:#fff; padding:10px 14px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .3s; max-width:90vw}
.toast.on{opacity:1}
.disclaim{position:fixed; left:12px; top:calc(76px + env(safe-area-inset-top,0px)); z-index:8; font:400 11px/1.3 var(--mono); color:var(--lead); background:rgba(251,251,249,.85); padding:4px 8px; border-radius:6px}
@media (max-width: 700px){
  .brand span{display:none}
  .mini{width:140px; bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .modes button{padding:0 10px}
  .listbtn .t{display:none}
}
@media print{
  body{overflow:visible} #view,.top,.rooms,.mini,.joy,.hint,.card{display:none!important}
  .panel{position:static; transform:none; width:auto; border:0} .panel header button,.totals .acts{display:none}
}
</style>
</head>
<body>
<canvas id="view" aria-label="Vizualizare 3D a apartamentului"></canvas>

<div class="top">
  <div class="brand"><b id="projName">Apartament 2 camere</b><span id="projMeta"></span></div>
  <div class="modes" role="group" aria-label="Mod de vizualizare">
    <button type="button" id="mWalk" aria-pressed="true">Tur</button>
    <button type="button" id="mHouse" aria-pressed="false">Machetă</button>
  </div>
  <button class="listbtn" id="openList" type="button"><span class="t">Lista de cumpărături</span><span class="n" id="listTotal">0 lei</span></button>
</div>

<div class="disclaim">Modele 3D la dimensiunile și finisajele oficiale</div>
<div class="hint" id="hint">Trage ca să privești în jur · W A S D sau săgețile ca să mergi</div>
<nav class="rooms" id="rooms" aria-label="Camere"></nav>
<div class="mini" aria-label="Plan"><div class="cap"><span>Plan</span><span id="miniArea"></span></div><svg id="miniSvg"></svg></div>
<div class="joy" id="joy" aria-hidden="true"><i id="joyKnob"></i></div>

<div class="card" id="card" role="dialog" aria-live="polite">
  <h3 id="cName"></h3><div class="store" id="cStore"></div>
  <div class="price" id="cPrice"></div>
  <dl id="cDims"></dl>
  <div class="optsTitle" id="optsTitle">Alege varianta</div>
  <div class="opts" id="cOpts" role="listbox" aria-label="Variante"></div>
  <div class="tools" id="cTools">
    <button type="button" id="tMove">Mută</button><button type="button" id="tRot">Rotește 90°</button><button type="button" id="tReset">Poziție automată</button>
  </div>
  <div class="nudge" id="cNudge" hidden>
    <div class="gaps" id="cGaps"></div>
    <div class="pad"><button type="button" data-n="0,-1" aria-label="Sus 5 cm">↑</button><button type="button" data-n="-1,0" aria-label="Stânga 5 cm">←</button><button type="button" data-n="1,0" aria-label="Dreapta 5 cm">→</button><button type="button" data-n="0,1" aria-label="Jos 5 cm">↓</button></div>
    <button type="button" id="tDone" class="done">Gata</button>
  </div>
  <div class="row"><a id="cLink" target="_blank" rel="noopener">Vezi produsul</a><button class="x" id="cClose" type="button">Închide</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<aside class="panel" id="panel" aria-label="Lista de cumpărături">
  <header><div><h2>Lista de cumpărături</h2><p id="panelSub"></p></div><button type="button" id="closeList" aria-label="Închide lista">×</button></header>
  <div class="body" id="listBody"></div>
  <div class="totals" id="totals"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
/* =====================================================================
   1) PLANUL — se completează din releveul apartamentului (planșa din
   documentația cadastrală). Unități: metri. x spre dreapta, z în jos.
   ===================================================================== */
const PLAN = {
  nume: 'Apartament 2 camere, decomandat', inaltime: 2.6,
  camere: [
    { id: 'hol',       nume: 'Hol',       tip: 'hol',       x0: 0,   z0: 2.6, x1: 3.2, z1: 5.0 },

    { a: [0, 0],     b: [8.8, 0],   ext: true, goluri: [{ tip: 'fereastra', la: .8, l: 1.4 }, { tip: 'fereastra', la: 5.0, l: 2.5 }] },
    { a: [8.8, 0],   b: [8.8, 7],   ext: true, goluri: [{ tip: 'fereastra', la: .8, l: 2.0 }, { tip: 'fereastra', la: 4.6, l: 1.6 }] },

};

/* =====================================================================
   2) CATALOGUL — produse reale, prețuri verificate pe 30.09.2026.
   Dimensiuni în cm (lățime x adâncime x înălțime). Prețurile se schimbă:
   verifică pe site înainte de comandă.
   ===================================================================== */
/* =====================================================================

   verificate pe 30.09.2026 pe ikea.com/ro și dedeman.ro. Dimensiuni în cm
   (lățime x adâncime x înălțime). „aprox" = dimensiune estimată, verifică

   ===================================================================== */
const DATA_PRET = '30.09.2026';
const IK = 'https://www.ikea.com/ro/ro/', DD = 'https://www.dedeman.ro/ro/';
const OPTS = {
  canapea: { eticheta: 'Canapea', model: 'sofa', v: [
    { nume: 'KIVIK canapea 3 locuri, Tibbleby bej/gri', mag: 'IKEA', pret: 2299, w: 228, d: 95, h: 83, url: IK + 'p/kivik-canapea-3-locuri-tibbleby-bej-gri-s49440597/', s: { mat: 'fabric', col: '#aea395' } },
    { nume: 'KIVIK canapea 3 locuri, Tresund bej deschis', mag: 'IKEA', pret: 2049, w: 228, d: 95, h: 83, url: IK + 'p/kivik-canapea-3-locuri-tresund-bej-deschis-s89482830/', s: { mat: 'fabric', col: '#d8ccb8' } },
    { nume: 'KIVIK canapea 3 locuri, Kelinge gri-turcoaz', mag: 'IKEA', pret: 2599, w: 228, d: 95, h: 83, url: IK + 'p/kivik-canapea-3-locuri-kelinge-gri-turcoaz-s39443049/', s: { mat: 'velvet', col: '#3c6a6b' } },
    { nume: 'KIVIK canapea 3 locuri, piele Grann/Bomstad negru', mag: 'IKEA', pret: 3500, w: 228, d: 95, h: 83, url: IK + 'p/kivik-canapea-3-locuri-grann-bomstad-negru-00519525/', s: { mat: 'leather', col: '#1c1c1e' } },
    { nume: 'KIVIK canapea 3 locuri cu șezlong, Tresund antracit', mag: 'IKEA', pret: 3349, w: 280, d: 163, h: 83, aprox: true, url: IK + 'p/kivik-canapea-3-locuri-cu-sezlong-tresund-antracit-s99482839/', s: { mat: 'fabric', col: '#4a4c50', chaise: true } } ] },

    { nume: 'BESTÅ comodă TV cu uși, aspect stejar antichizat, 120x42x74', mag: 'IKEA', pret: 750, w: 120, d: 42, h: 74, url: IK + 'cat/comode-tv-besta-12153/', s: { col: '#b89a74', wood: true, fronts: 2, tall: true } },

  masuta: { eticheta: 'Măsuță de cafea', model: 'coffee', v: [

  biblioteca: { eticheta: 'Bibliotecă', model: 'shelf', v: [

    { nume: 'BILLY bibliotecă, alb, 80x28x202 cm', mag: 'IKEA', pret: 279, w: 80, d: 28, h: 202, url: IK + 'p/billy-biblioteca-alb-00263850/', s: { type: 'billy', col: '#f3f3f0' } },

const saveState = () => { try { localStorage.setItem('casa_picked', JSON.stringify([...PICKED])); localStorage.setItem('casa_sel', JSON.stringify(SEL)); localStorage.setItem('casa_ovr', JSON.stringify(OVR)); } catch (e) {} };
const furniture = new THREE.Group(); scene.add(furniture);
let placed = [], pickables = [], blockers = [], NOFIT = [];
const fpFrom = (x, z, rot, w, d) => { const q = Math.round(rot / (Math.PI / 2)) % 2 !== 0; const hw = (q ? d : w) / 2, hd = (q ? w : d) / 2; return { x0: x - hw, x1: x + hw, z0: z - hd, z1: z + hd, rot }; };
function validSpot(p, fp, others){ const room = PLAN.camere.find(r => r.id === p.room); if (!room || !inside(room, fp)) return false;
  if (doorZones(room).some(z => rectHit(z, fp))) return false; return !others.some(o => o !== p && rectHit(o.fp, fp)); }
function rebuild(){
  NOFIT = []; placed = autoFurnish();
  const cnt = {}; placed.forEach(p => { const k = p.key + '#' + p.room; cnt[k] = (cnt[k] || 0) + 1; p.id = k + '#' + cnt[k]; });
  placed.forEach(p => { const o = OVR[p.id]; if (!o) return; const it = CAT[p.key], fp = fpFrom(o.x, o.z, o.rot, it.w / 100, it.d / 100);
    if (validSpot(p, fp, placed)){ p.free = true; p.x = o.x; p.z = o.z; p.rot = o.rot; p.fp = fp; p.front = null; } else delete OVR[p.id]; });
  while (furniture.children.length) furniture.remove(furniture.children[0]);
  pickables = []; placed.forEach(p => { const m = model(p.key);
    if (p.free){ m.position.set(p.x, 0, p.z); m.rotation.y = p.rot || 0; } else { const fp = p.fp; m.position.set((fp.x0 + fp.x1) / 2, 0, (fp.z0 + fp.z1) / 2); m.rotation.y = fp.rot; p.x = m.position.x; p.z = m.position.z; p.rot = fp.rot; }
    m.userData = { pid: p.id, key: p.key }; m.traverse(o => { o.userData.item = m; }); furniture.add(m); pickables.push(m); p.obj = m; });
  blockers = placed.filter(p => p.key !== 'scaunBirou').map(p => p.fp);
  drawMini(); renderList(); saveState();
}

/* =====================================================================
   5) NAVIGARE + EDITARE
   ===================================================================== */
let mode = 'walk', yaw = 0, pitch = 0; const EYE = 1.6, player = new THREE.Vector3();
const W0 = Math.max(W, D) * 1.15;
function collide(x, z){ const r = .24;
  for (const c of colliders){ const px = x - c.ax, pz = z - c.az, s = Math.max(c.s0, Math.min(c.s1, px * c.ux + pz * c.uz)), cx = c.ax + c.ux * s, cz = c.az + c.uz * s, dx = x - cx, dz = z - cz, dd = Math.hypot(dx, dz);
    if (dd < r + .07 && dd > 1e-6){ const k = (r + .07 - dd) / dd; x += dx * k; z += dz * k; } }
  for (const b of blockers){ if (x > b.x0 - r && x < b.x1 + r && z > b.z0 - r && z < b.z1 + r){
    const dl = x - (b.x0 - r), dr = (b.x1 + r) - x, du = z - (b.z0 - r), dn = (b.z1 + r) - z, m = Math.min(dl, dr, du, dn);
    if (m === dl) x = b.x0 - r; else if (m === dr) x = b.x1 + r; else if (m === du) z = b.z0 - r; else z = b.z1 + r; } }
  return [x, z]; }
const roomAt = (x, z) => PLAN.camere.find(r => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1);
function spawnFor(room){ let best = null; ['N', 'S', 'W', 'E'].forEach(s => openingsOnSide(room, s).filter(o => o.tip === 'usa').forEach(o => { const m = (o.a + o.b) / 2;
    const p = s === 'N' ? [m, room.z0 + .55] : s === 'S' ? [m, room.z1 - .55] : s === 'W' ? [room.x0 + .55, m] : [room.x1 - .55, m]; if (!best) best = p; }));
  const cx = (room.x0 + room.x1) / 2, cz = (room.z0 + room.z1) / 2; const p = best || [cx, cz]; const [x, z] = collide(p[0], p[1]); return { x, z, yaw: Math.atan2(-(cx - x), -(cz - z)) }; }
function goRoom(id, instant){ const r = PLAN.camere.find(q => q.id === id); if (!r) return; if (mode !== 'walk') setMode('walk', true);
  const s = spawnFor(r), dy = ((s.yaw - yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  if (instant || reduce || !window.gsap){ player.set(s.x, 0, s.z); yaw = s.yaw; pitch = -.08; return; }
  gsap.to(player, { x: s.x, z: s.z, duration: 1.1, ease: 'power2.inOut' }); const o = { v: yaw }; gsap.to(o, { v: yaw + dy, duration: 1.1, ease: 'power2.inOut', onUpdate: () => { yaw = o.v; } }); pitch = -.08; }
const keys = {}; addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; }); addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let dragging = false, lx = 0, ly = 0, moved = 0, orbit = { th: -.7, ph: .95, r: W0 };
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitPt = new THREE.Vector3();
let sel = null, editing = false, dragOff = null, lastValid = null;
const ghost = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x2F6B4F, transparent: true, opacity: .35, depthWrite: false })); ghost.rotation.x = -Math.PI / 2; ghost.position.y = .012; ghost.visible = false; scene.add(ghost);
const floorAt = e => { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam); return ray.ray.intersectPlane(floorPlane, hitPt) ? hitPt.clone() : null; };
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; moved = 0; canvas.setPointerCapture(e.pointerId);
  if (editing && sel){ const f = floorAt(e); if (f) dragOff = { x: sel.x - f.x, z: sel.z - f.z }; } });
canvas.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (editing && sel && dragOff){ const f = floorAt(e); if (f) moveSel(f.x + dragOff.x, f.z + dragOff.z, true); return; }
  if (mode === 'walk'){ yaw -= dx * .0045; pitch = Math.max(-1.2, Math.min(1.1, pitch - dy * .0035)); } else { orbit.th -= dx * .006; orbit.ph = Math.max(.12, Math.min(1.45, orbit.ph - dy * .005)); } });
canvas.addEventListener('pointerup', e => { dragging = false; if (editing && sel && dragOff){ dragOff = null; commitMove(); return; } if (moved < 6) pick(e); });
canvas.addEventListener('wheel', e => { if (mode === 'house'){ orbit.r = Math.max(5, Math.min(26, orbit.r + e.deltaY * .01)); e.preventDefault(); } }, { passive: false });
const joy = $('#joy'), knob = $('#joyKnob'); let jx = 0, jz = 0, jOn = false;
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
joy.addEventListener('pointerdown', e => { jOn = true; joy.setPointerCapture(e.pointerId); jmove(e); });
joy.addEventListener('pointermove', e => { if (jOn) jmove(e); });
joy.addEventListener('pointerup', () => { jOn = false; jx = jz = 0; knob.style.transform = ''; });
function jmove(e){ const r = joy.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2, L = Math.min(40, Math.hypot(dx, dy)), a = Math.atan2(dy, dx); jx = Math.cos(a) * L / 40; jz = Math.sin(a) * L / 40; knob.style.transform = `translate(${Math.cos(a) * L}px,${Math.sin(a) * L}px)`; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }

// selectare + variante

  $('#optsTitle').textContent = `Alege varianta (${g.v.length})`;
  $('#cOpts').innerHTML = g.v.map((v, i) => `<button type="button" class="opt" role="option" data-i="${i}" aria-selected="${SEL[key] === i}"><i style="background:${esc((v.s && (v.s.col || v.s.top || v.s.frame || v.s.prof)) || '#ddd')}"></i><span><b>${esc(v.nume)}</b><small>${v.w} × ${v.d} × ${v.h} cm${v.aprox ? ' aprox.' : ''}</small></span><span class="p">${lei(v.pret)}</span></button>`).join('');
  $('#cLink').href = it.url; $('#card').classList.add('on'); }

  showCard(); });

// mutare exactă: trage, lipire de perete, rotire, pași de 5 cm
function gapsFor(p){ const room = PLAN.camere.find(r => r.id === p.room), t = WT / 2, fp = p.fp;
  return { st: (fp.x0 - room.x0 - t) * 100, dr: (room.x1 - t - fp.x1) * 100, sus: (fp.z0 - room.z0 - t) * 100, jos: (room.z1 - t - fp.z1) * 100 }; }
function showGaps(ok){ const g = gapsFor(sel), f = v => `<b>${Math.max(0, Math.round(v))} cm</b>`;
  $('#cGaps').innerHTML = `Față de pereți: stânga ${f(g.st)} · dreapta ${f(g.dr)} · sus ${f(g.sus)} · jos ${f(g.jos)}` + (ok ? '' : '<br><span class="bad">Poziție invalidă: se suprapune sau blochează o ușă.</span>'); }
function moveSel(x, z, snap){ const it = CAT[sel.key], w = it.w / 100, d = it.d / 100, room = PLAN.camere.find(r => r.id === sel.room), t = WT / 2 + .005; let rot = sel.rot;

      const hw = (fp.x1 - fp.x0) / 2, hd = (fp.z1 - fp.z0) / 2; if (side === 'W') x = room.x0 + t + hw; if (side === 'E') x = room.x1 - t - hw; if (side === 'N') z = room.z0 + t + hd; if (side === 'S') z = room.z1 - t - hd; fp = fpFrom(x, z, rot, w, d); } }

$('#tRot').onclick = () => { if (!sel) return; if (!editing) startEdit(); const r = sel.rot; sel.rot = (sel.rot + Math.PI / 2) % (Math.PI * 2); if (!moveSel(sel.x, sel.z, false)){ sel.rot = r; moveSel(sel.x, sel.z, false); toast('Rotită nu încape aici. Mut-o întâi.'); } else commitMove(); };
$('#tReset').onclick = () => { if (!sel) return; const pid = sel.id; delete OVR[pid]; endEdit(); rebuild(); sel = placed.find(p => p.id === pid) || null; if (sel) showCard(); else closeCard(); toast('Piesa a revenit la poziția automată.'); };

  document.body.classList.toggle('walk', m === 'walk'); ceilings.visible = m === 'walk';
  const sy = m === 'walk' ? 1 : .42; if (window.gsap && !reduce && !silent) gsap.to(walls.scale, { y: sy, duration: .8, ease: 'power2.inOut' }); else walls.scale.y = sy;

const S = 20, svg = $('#miniSvg'); svg.setAttribute('viewBox', `-4 -4 ${W * S + 8} ${D * S + 8}`); $('#miniArea').textContent = totalArea.toFixed(0) + ' m²';

  + `<g id="me" pointer-events="none"><circle r="5" fill="#1F4E79"/><path d="M0 0 L-6 -14 L6 -14 Z" fill="#1F4E79" opacity=".35"/></g>`; }

function renderList(){
  const rows = []; placed.forEach(p => { rows.push({ key: p.key, room: p.room }); Object.entries(OPTS).filter(([, x]) => x.inclus === p.key).forEach(([k]) => rows.push({ key: k, room: p.room })); });
  const byRoom = {}; rows.forEach(r => { (byRoom[r.room] = byRoom[r.room] || {}); byRoom[r.room][r.key] = (byRoom[r.room][r.key] || 0) + 1; });

}
$('#openList').onclick = () => $('#panel').classList.add('on'); $('#closeList').onclick = () => $('#panel').classList.remove('on');

/* =====================================================================
   7) PORNIRE + BUCLA
   ===================================================================== */
function resize(){ R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.fov = innerWidth < innerHeight ? 78 : 68; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
rebuild(); goRoom('hol', true); setMode('walk', true); setMode.t = setTimeout(() => $('#hint').style.opacity = 0, 5000);
let last = performance.now(), lastRoom = null;
(function loop(){ requestAnimationFrame(loop); const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'walk'){ let f = 0, s = 0; if (keys.w || keys.arrowup) f += 1; if (keys.s || keys.arrowdown) f -= 1; if (keys.a || keys.arrowleft) s -= 1; if (keys.d || keys.arrowright) s += 1; f -= jz; s += jx;
    if (f || s){ const sp = 1.7 * dt, fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw); const [x, z] = collide(player.x + (fx * f + rx * s) * sp, player.z + (fz * f + rz * s) * sp); player.x = x; player.z = z; }
    cam.position.set(player.x, EYE, player.z); cam.rotation.order = 'YXZ'; cam.rotation.set(pitch, yaw, 0);
  } else { const t = new THREE.Vector3(C.x + Math.sin(orbit.th) * Math.sin(orbit.ph) * orbit.r, Math.cos(orbit.ph) * orbit.r, C.z + Math.cos(orbit.th) * Math.sin(orbit.ph) * orbit.r); cam.position.lerp(t, Math.min(1, dt * 5)); cam.lookAt(C); }
  const rm = roomAt(player.x, player.z); if (rm && rm.id !== lastRoom){ lastRoom = rm.id; document.querySelectorAll('#rooms button').forEach(b => b.classList.toggle('on', b.dataset.r === rm.id)); }
  const me = document.getElementById('me'); if (me) me.setAttribute('transform', `translate(${player.x * S} ${player.z * S}) rotate(${-yaw * 180 / Math.PI})`);
  R.render(scene, cam); })();
})();
