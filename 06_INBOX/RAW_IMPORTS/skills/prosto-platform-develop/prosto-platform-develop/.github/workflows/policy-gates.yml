name: policy-gates

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-policy:
    name: FF-01/FF-02 architecture-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: FF-01 kernel boundary guard
        run: npm run lint:architecture

      - name: FF-02 dependency policy guard
        run: npm run validate:dependency-policy

  runtime-policy:
    name: FF-04 runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: FF-04 startup diagnostics and runtime policy
        run: npm run validate:runtime-policy
