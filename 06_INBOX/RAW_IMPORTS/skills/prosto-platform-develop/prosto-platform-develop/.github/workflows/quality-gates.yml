name: quality-gates

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-determinism:
    name: FF-03/FF-05 quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: FF-03 lifecycle determinism
        run: npm run test:lifecycle-determinism

      - name: FF-05 contracts gate
        run: npm run test:contracts

  bench-regression:
    name: FF-06 perf-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run startup benchmark
        run: npm run bench:startup

      - name: Run event-dispatch benchmark
        run: npm run bench:events

      - name: FF-06 perf regression gate
        run: npm run bench:regression
        env:
          BASELINE_FILE: packages/platform-core/bench/baseline.json
          STARTUP_REPORT: bench-reports/startup.json
          EVENTS_REPORT: bench-reports/events.json
          STARTUP_DRIFT_PERCENT: 15
          EVENTS_DRIFT_PERCENT: 15

      - name: Upload bench reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-reports
          path: bench-reports/
          if-no-files-found: ignore
