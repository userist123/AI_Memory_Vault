name: release-readiness

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: release-readiness-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate release evidence manifest
        run: npm run release:evidence

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-manifest
          path: .temp/ci/release-evidence.json
          if-no-files-found: error
