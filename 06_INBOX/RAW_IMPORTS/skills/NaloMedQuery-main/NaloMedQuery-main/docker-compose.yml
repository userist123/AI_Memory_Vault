services:
  mysql:
    image: mysql:8.0
    container_name: medquery_mysql
    restart: always
    environment:
      MYSQL_DATABASE: medquery
      MYSQL_USER: medquery_user
      MYSQL_PASSWORD: medquery_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
