services:
  web:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - AGENT_GATEWAY_URL=${AGENT_GATEWAY_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/code/
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=devmind
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=devmind
      
    volumes:
      - postgres_data:/var/lib/postgresql/data # Saves your data so it isn't deleted on restart

volumes:
  postgres_data: # Declares the volume used by the db service