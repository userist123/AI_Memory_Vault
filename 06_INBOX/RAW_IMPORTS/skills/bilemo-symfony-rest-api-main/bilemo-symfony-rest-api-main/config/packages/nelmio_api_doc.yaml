nelmio_api_doc:
    documentation:
        info:
            title: BileMo B2B API
            description: Premium Mobile Product Catalog and Client Management REST API.
            version: 1.0.0

          # --- TAGS FOR API ENDPOINTS ORDER ---
        tags:
            - name: Authentication
              description: Secure token generation and B2B client onboarding entry points.
            - name: Client Context Profiles
              description: Connected organization workspace profiles and metadata operations.
            - name: Products
              description: Premium mobile product device inventory configurations catalog.
            - name: Users
              description: Customer profiles and terminal user configurations registry management.
        # ---------------------------------------------------

        # --- Login Check path display configuration ---
        paths:
            /login_check:
                post:
                    tags:
                        - Authentication
                    summary: Obtain a JWT Bearer Token for B2B Client authentication
                    description: Exchange valid B2B client credentials (username/password) for a securely signed JWT token.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required:
                                        - username
                                        - password
                                    properties:
                                        username:
                                            type: string
                                            description: The unique identifier email or client username reference
                                            example: John-doe
                                        password:
                                            type: string
                                            description: The raw account security password string
                                            example: SecretPassword123!
                    responses:
                        '200':
                            description: Success - Returns the computed authentication token payload
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token:
                                                type: string
                                                description: The cryptographically signed JWT Bearer Token string
                                                example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                        '401':
                            description: Unauthorized - Invalid credentials payload or structured data anomalies
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            code:
                                                type: integer
                                                example: 401
                                            message:
                                                type: string
                                                example: Invalid credentials.
        # ----------------------------------------

        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - BearerAuth: []
    areas:
        path_patterns:
            - ^/products
            - ^/users
            - ^/profile
