<!doctype html>
<!-- Template scenă three.js pentru captură deterministă. Copiază în folderul proiectului, rulează acolo
     `npm i three` (three LOCAL, nu de pe CDN) și editează doar secțiunea SCENA.
     Contract cu web_capture.mjs:
       window.renderAt(tSec)  - pune scena în starea de la momentul t și randează (fără rAF, fără Date.now)
       window.ready = true    - abia după ce TOATE asset-urile (texturi, GLTF, fonturi) s-au încărcat
     Pentru previzualizare interactivă deschide cu ?live=1 (folosește rAF doar atunci). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1920), H = +(params.get('h') || 1080);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: params.has('alpha') });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);

// easing-uri uzuale (t în 0..1)
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a)); // progres 0..1 între secundele a și b

// PRNG cu seed (NU Math.random) pentru orice element "aleator"
let seed = 12345; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- SCENA: editează de aici ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x202030, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(3, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.5); rim.position.set(-3, 2, -4); scene.add(rim);

const hero = new THREE.Mesh(new THREE.TorusKnotGeometry(0.8, 0.28, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0xff6a00, metalness: 0.5, roughness: 0.25 }));
scene.add(hero);

const DURATION = 4; // secunde; trimite același număr la web_capture.mjs --seconds
function update(t) {
  const intro = ease.outBack(seg(t, 0, 0.8));
  hero.scale.setScalar(Math.max(0.001, intro));
  hero.rotation.y = (t / DURATION) * Math.PI * 2;      // o tură completă = buclă curată
  hero.rotation.x = Math.sin((t / DURATION) * Math.PI * 2) * 0.3;
  camera.position.set(0, 1.2, 5.5);
  camera.lookAt(0, 0, 0);
}
async function loadAssets() {
  // ex.: const tex = await new THREE.TextureLoader().loadAsync('./tex.jpg');
  // ex.: const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'); ...
  await document.fonts.ready;
}
// ---------- până aici ----------

window.renderAt = (t) => { update(t); renderer.render(scene, camera); };
await loadAssets();
window.renderAt(0);
window.ready = true;

if (params.has('live')) {
  const t0 = performance.now();
  const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body></html>
