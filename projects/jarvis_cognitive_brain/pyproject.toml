[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-cognitive-brain"
version = "0.1.0"
description = "Autonomous, local, self-improving Cognitive Brain system with OODA loop and persistent memory."
authors = [{ name = "Jarvis AI Team" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

voice = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1.0",
    "silero-vad>=5.1.0",
    "onnxruntime>=1.17.0",
    "kokoro-onnx>=0.4.0",
    "fastmcp>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p pytest_asyncio"
markers = [
    "asyncio: mark a test as an asyncio coroutine function",
]


